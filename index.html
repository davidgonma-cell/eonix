<!-- ===== FORCE CACHE RESET (v5 — 2026-05-05 — full audit fixes) ===== -->
<script>
(function() {
  var EONIX_VERSION = "v19-2026-05-05-toggle-rerender-fix";
  try {
    var stored = localStorage.getItem("eonix_app_version");
    if (stored !== EONIX_VERSION) {
      localStorage.setItem("eonix_app_version", EONIX_VERSION);
      if (stored !== null && "serviceWorker" in navigator) {
        Promise.all([
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            return Promise.all(regs.map(function(r) { return r.unregister(); }));
          }),
          (typeof caches !== "undefined" && caches.keys ? caches.keys().then(function(keys) {
            return Promise.all(keys.map(function(k) { return caches.delete(k); }));
          }) : Promise.resolve())
        ]).then(function() {
          console.log("[EONIX] Cache limpiada. Recargando con la nueva versión.");
          window.location.reload();
        }).catch(function(e) {
          console.warn("[EONIX] Limpieza de caché falló (continuando):", e);
        });
      }
    }
  } catch (e) {
    console.warn("[EONIX] version check failed:", e);
  }
})();
</script>

const C = {

  // Olive — sage más suave y elegante

// Fondo "agua/burbujas" — capas de radial-gradients que producen un efecto orgánico fluido,
// como reflejos de luz en agua. Mezcla los colores de marca (oliva, dorado, terra) en círculos
// translúcidos para crear sensación relajante de agua con profundidad.
const BUBBLE_BG = "radial-gradient(circle 300px at 15% 12%, rgba(154,175,110,0.38) 0%, rgba(154,175,110,0.0) 72%), radial-gradient(circle 260px at 88% 22%, rgba(201,167,102,0.34) 0%, rgba(201,167,102,0.0) 72%), radial-gradient(circle 340px at 50% 58%, rgba(140,170,140,0.26) 0%, rgba(140,170,140,0.0) 65%), radial-gradient(circle 220px at 10% 62%, rgba(194,129,105,0.22) 0%, rgba(194,129,105,0.0) 70%), radial-gradient(circle 280px at 92% 75%, rgba(122,138,92,0.32) 0%, rgba(122,138,92,0.0) 70%), radial-gradient(circle 200px at 35% 95%, rgba(201,167,102,0.28) 0%, rgba(201,167,102,0.0) 70%), radial-gradient(circle 160px at 70% 42%, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.0) 75%), radial-gradient(circle 130px at 22% 35%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.0) 75%), radial-gradient(circle 100px at 78% 92%, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.0) 75%), #FAF7EF";

/* ============================================================
   ILUSTRACIONES SVG
   ============================================================ */

// Decorative leaves cluster (corner)

/* Country baselines (OMS 2024 — esperanza de vida al nacer, redondeada) */
const COUNTRY_BASE = {
  ES: { name: "España",          M: 81.0, F: 86.3 },
  MX: { name: "México",          M: 73.5, F: 79.4 },
  AR: { name: "Argentina",       M: 76.1, F: 80.6 },

  VE: { name: "Venezuela",       M: 70.6, F: 78.2 },
  EC: { name: "Ecuador",         M: 75.8, F: 81.0 },
  UY: { name: "Uruguay",         M: 75.0, F: 81.7 },
  US: { name: "Estados Unidos",  M: 76.4, F: 81.2 },
  CA: { name: "Canadá",          M: 80.3, F: 84.5 },
  GB: { name: "Reino Unido",     M: 79.0, F: 82.9 },
  FR: { name: "Francia",         M: 79.7, F: 85.1 },
  DE: { name: "Alemania",        M: 78.9, F: 83.4 },
  IT: { name: "Italia",          M: 81.1, F: 85.2 },
  PT: { name: "Portugal",        M: 78.4, F: 84.5 },
  JP: { name: "Japón",           M: 81.5, F: 87.6 },
  OTHER: { name: "Otro país",    M: 78.0, F: 83.0 },
};

/* Cálculo: IMC + país + hábitos + genética + condiciones
   ───────────────────────────────────────────────────────
   IMPORTANTE: Esta función NUNCA debe lanzar excepciones.
   Si hay datos faltantes, mal tipados o NaN, se aplican
   valores por defecto seguros y se devuelve un resultado
   válido. Si todo lo demás falla, se devuelve un resultado
   mínimo del país "OTHER". */
const calculateLifespan = (rawData) => {
  // 1) Coerción segura de TODOS los inputs (nunca throws)
  const r = rawData && typeof rawData === "object" ? rawData : {};
  const toInt = (v, def) => {
    const n = typeof v === "number" ? v : parseInt(v, 10);
    return Number.isFinite(n) ? n : def;
  };
  const toStr = (v) => (typeof v === "string" ? v : "");
  const safe = {
    age:       Math.max(14, Math.min(108, toInt(r.age, 30))),
    gender:    r.gender === "F" ? "F" : r.gender === "M" ? "M" : "M",
    height:    Math.max(120, Math.min(230, toInt(r.height, 170))),
    weight:    Math.max(30,  Math.min(250, toInt(r.weight, 70))),
    country:   COUNTRY_BASE[toStr(r.country)] ? toStr(r.country) : "OTHER",
    civil:     toStr(r.civil),
    diet:      toStr(r.diet),
    exercise:  toStr(r.exercise),
    alcohol:   toStr(r.alcohol),
    sleep:     toStr(r.sleep),
    stress:    toStr(r.stress),
    social:    toStr(r.social),
    purpose:   toStr(r.purpose),
    familyLongevity: toStr(r.familyLongevity),
    smoke:     toStr(r.smoke),
    conditions:    Array.isArray(r.conditions) ? r.conditions.filter(c => typeof c === "string") : [],
    bloodPressure: toStr(r.bloodPressure),
    restingHR:     Math.max(0, Math.min(220, toInt(r.restingHR, 0))),
  };

  try {
    const country = COUNTRY_BASE[safe.country] || COUNTRY_BASE.OTHER;
    let base = safe.gender === "F" ? country.F : country.M;
    const factors = [];

    // --- IMC real (altura cm + peso kg) ---
    const heightM = safe.height / 100;
    const bmi = heightM > 0 ? safe.weight / (heightM * heightM) : 22;
    let bmiYears, bmiLabel;
    if (bmi < 18.5)        { bmiYears = -2; bmiLabel = `IMC ${bmi.toFixed(1)} — Bajo peso`; }
    else if (bmi < 25)     { bmiYears = 1.5; bmiLabel = `IMC ${bmi.toFixed(1)} — Saludable`; }
    else if (bmi < 30)     { bmiYears = -1.5; bmiLabel = `IMC ${bmi.toFixed(1)} — Sobrepeso`; }
    else if (bmi < 35)     { bmiYears = -4; bmiLabel = `IMC ${bmi.toFixed(1)} — Obesidad I`; }
    else                   { bmiYears = -8; bmiLabel = `IMC ${bmi.toFixed(1)} — Obesidad severa`; }
    factors.push({ key: "bmi", y: bmiYears, l: bmiLabel, cat: "Cuerpo (IMC)", group: "diet" });

    // --- Tabaco ---
    const smk = { never: { y: 0, l: "No fumas" },
                  former: { y: -1.5, l: "Lo dejaste — recuperando años" },
                  vape:   { y: -3, l: "Vapeo — menos dañino pero no inocuo" },
                  yes: { y: -8, l: "Fumar resta años de vida" } };
    if (smk[safe.smoke]) factors.push({ key: "smoke", ...smk[safe.smoke], cat: "Tabaco", group: "habits" });

    // --- Alcohol ---
    const alc = { none: { y: 0.5, l: "Sin alcohol" },
                  moderate: { y: 0, l: "Consumo moderado" },
                  heavy: { y: -6, l: "Alcohol frecuente" } };
    if (alc[safe.alcohol]) factors.push({ key: "alcohol", ...alc[safe.alcohol], cat: "Alcohol", group: "habits" });

    // --- Movimiento ---
    const ex = { none: { y: -4, l: "Sedentarismo" },
                 light: { y: 1, l: "Algo de actividad" },
                 moderate: { y: 4, l: "Actividad regular" },
                 intense: { y: 5, l: "Muy activo/a" } };
    if (ex[safe.exercise]) factors.push({ key: "exercise", ...ex[safe.exercise], cat: "Movimiento", group: "activity" });

    // --- Alimentación ---
    const dt = { poor: { y: -3, l: "Dieta procesada" },
                 average: { y: 0, l: "Alimentación promedio" },
                 good: { y: 3, l: "Buena alimentación" },
                 excellent: { y: 5, l: "Dieta tipo Blue Zone" } };
    if (dt[safe.diet]) factors.push({ key: "diet", ...dt[safe.diet], cat: "Alimentación", group: "diet" });

    // --- Sueño ---
    const sl = { lt6: { y: -3, l: "Dormir poco envejece" },
                 s67: { y: -1, l: "Algo escaso" },
                 s79: { y: 2, l: "Sueño óptimo" },
                 gt9: { y: -1, l: "Demasiado sueño" } };
    if (sl[safe.sleep]) factors.push({ key: "sleep", ...sl[safe.sleep], cat: "Descanso", group: "rest" });

    // --- Estrés ---
    const st = { high: { y: -4, l: "Estrés crónico" },
                 moderate: { y: -1, l: "Estrés a ratos" },
                 low: { y: 2, l: "Calma diaria" } };
    if (st[safe.stress]) factors.push({ key: "stress", ...st[safe.stress], cat: "Mente", group: "rest" });

    // --- Vínculos ---
    const so = { isolated: { y: -5, l: "Pocos vínculos" },
                 average: { y: 0, l: "Vínculos suficientes" },
                 strong: { y: 4, l: "Tribu fuerte" } };
    if (so[safe.social]) factors.push({ key: "social", ...so[safe.social], cat: "Vínculos", group: "social" });

    // --- Estado civil ---
    const civ = { single: { y: 0, l: "Soltero/a" },
                  married: { y: 3, l: "En pareja — protección emocional" },
                  cohabit: { y: 2, l: "Conviviendo" },
                  divorced: { y: -1, l: "Divorciado/a" },
                  widowed: { y: -2, l: "Viudo/a" } };
    if (civ[safe.civil]) factors.push({ key: "civil", ...civ[safe.civil], cat: "Estado civil", group: "social" });

    // --- Propósito ---
    const pp = { no: { y: -3, l: "Buscando propósito" },
                 sometimes: { y: 2, l: "A medias" },
                 yes: { y: 6, l: "Ikigai claro" } };
    if (pp[safe.purpose]) factors.push({ key: "purpose", ...pp[safe.purpose], cat: "Propósito", group: "social" });

    // --- Genética: longevidad familiar (~25% del total según estudios de gemelos) ---
    const fam = { many: { y: 3, l: "Familia muy longeva" },
                  some: { y: 1, l: "Algunos familiares longevos" },
                  avg:  { y: 0, l: "Promedio familiar" },
                  early:{ y: -3, l: "Antecedentes de muerte temprana" },
                  unknown: { y: 0, l: "Sin datos familiares" } };
    if (fam[safe.familyLongevity]) factors.push({ key: "family", ...fam[safe.familyLongevity], cat: "Genética", group: "genetics" });

    // --- Condiciones crónicas (multi) ---
    if (safe.conditions.length > 0) {
      const condY = { diabetes: -7, hypertension: -3, heart: -5, cholesterol: -2, cancer: -4, depression: -3 };
      const condL = { diabetes: "Diabetes", hypertension: "Hipertensión", heart: "Enfermedad cardíaca", cholesterol: "Colesterol alto", cancer: "Cáncer (historial)", depression: "Depresión clínica" };
      safe.conditions.forEach(c => {
        if (condY[c] !== undefined) {
          factors.push({ key: `cond_${c}`, y: condY[c], l: condL[c], cat: condL[c], group: "medical" });
        }
      });
    }

    // --- Tensión arterial (opcional) ---
    if (safe.bloodPressure) {
      const bpY = { normal: 1, elevated: -1, high: -3 };
      const bpL = { normal: "Tensión normal", elevated: "Tensión elevada", high: "Hipertensión arterial" };
      if (bpY[safe.bloodPressure] !== undefined) {
        factors.push({ key: "bp", y: bpY[safe.bloodPressure], l: bpL[safe.bloodPressure], cat: "Tensión", group: "medical" });
      }
    }

    // --- Frecuencia cardíaca en reposo (opcional) ---
    if (safe.restingHR > 0) {
      let hrY, hrL;
      if (safe.restingHR < 60)      { hrY = 1; hrL = `${safe.restingHR} ppm — corazón eficiente`; }
      else if (safe.restingHR < 70) { hrY = 0.5; hrL = `${safe.restingHR} ppm — saludable`; }
      else if (safe.restingHR < 80) { hrY = 0; hrL = `${safe.restingHR} ppm — promedio`; }
      else if (safe.restingHR < 90) { hrY = -1; hrL = `${safe.restingHR} ppm — algo elevada`; }
      else                          { hrY = -2; hrL = `${safe.restingHR} ppm — elevada`; }
      factors.push({ key: "hr", y: hrY, l: hrL, cat: "Pulso reposo", group: "medical" });
    }

    const adjustment = factors.reduce((s, f) => s + (Number.isFinite(f.y) ? f.y : 0), 0);
    let expectancy = Math.max(safe.age + 2, Math.min(108, base + adjustment));
    if (!Number.isFinite(expectancy)) expectancy = base;
    const remaining = Math.max(0, expectancy - safe.age);
    const potential = Math.max(0, factors.filter(f => f.y < 0).reduce((s, f) => s + Math.abs(f.y), 0));

    // Group breakdown
    const groups = {
      habits:   { label: "Hábitos saludables", years: 0 },
      social:   { label: "Entorno y relaciones", years: 0 },
      diet:     { label: "Alimentación e IMC", years: 0 },
      activity: { label: "Actividad física", years: 0 },
      rest:     { label: "Descanso y mente", years: 0 },
      genetics: { label: "Genética familiar", years: 0 },
      medical:  { label: "Salud médica", years: 0 },
    };
    factors.forEach(f => { if (groups[f.group]) groups[f.group].years += f.y; });

    // Solo grupos con datos
    const activeGroups = {};
    Object.entries(groups).forEach(([k, g]) => { if (factors.some(f => f.group === k)) activeGroups[k] = g; });

    return {
      base, bmi: Math.round(bmi * 10) / 10,
      expectancy: Math.round(expectancy * 10) / 10,
      remaining: Math.round(remaining * 10) / 10,
      factors, potential: Math.round(potential),
      adjustment: Math.round(adjustment * 10) / 10,
      groups: activeGroups,
      countryName: country.name,
    };
  } catch (e) {
    console.error("[EONIX] calculateLifespan recovered from error:", e);
    // Resultado mínimo válido — la app NO se queda colgada
    const country = COUNTRY_BASE[safe.country] || COUNTRY_BASE.OTHER;
    const base = safe.gender === "F" ? country.F : country.M;
    return {
      base,
      bmi: 22,
      expectancy: base,
      remaining: Math.max(0, base - safe.age),
      factors: [],
      potential: 0,
      adjustment: 0,
      groups: {},
      countryName: country.name,
    };
  }
};

const Btn = ({ children, onClick, variant = "primary", disabled, full, icon }) => {
  const variantStyles = variant === "primary"
    ? { background: C.olive, color: C.paper, border: "none" }
    : variant === "terra"
    ? { background: C.terra, color: C.paper, border: "none" }
    : variant === "outline"
    ? { background: "transparent", color: C.olive, border: `1.5px solid ${C.olive}` }
    : variant === "ghost"
    ? { background: "transparent", color: C.ink, border: "none" }
    : variant === "soft"
    ? { background: C.paper, color: C.ink, border: `1px solid ${C.line}` }
    : { background: C.olive, color: C.paper, border: "none" };
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      className="tap-soft"
      style={{
        ...variantStyles,
        width: full ? "100%" : "auto",
        padding: "16px 24px",
        borderRadius: 999,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        gap: 8,
        fontWeight: 500,
        letterSpacing: "0.01em",
        fontSize: 16,
        fontFamily: "Roboto, system-ui, sans-serif",
        cursor: disabled ? "not-allowed" : "pointer",
        opacity: disabled ? 0.4 : 1,
        transition: "all 0.2s",
      }}
    >
      <span>{children}</span>
      {icon && <span style={{ display: "inline-flex" }}>{icon}</span>}
    </button>
  );
};

/* ============================================================
   MODO IMPACTO — métricas y componentes para el Inicio dramático
   Genera shock positivo controlado: número grande, potencial, "lo que ganas"
   ============================================================ */

const computeImpact = (data) => {
  if (!data || !data.factors) return { yearsToGain: 5, energyBoost: 25, riskReduction: 30, potentialPct: 75 };

  const negFactors = data.factors.filter(f => f.y < 0);
  const negSum = Math.abs(negFactors.reduce((s, f) => s + f.y, 0));

  // Años recuperables = factores negativos + buffer optimista
  const yearsToGain = Math.max(5, Math.min(15, Math.round(negSum + 3)));

  // % energía: depende de hábitos clave (ejercicio, sueño, estrés, dieta)
  const lowEnergyFactors = data.factors.filter(f =>
    ["exercise", "sleep", "stress", "diet"].includes(f.key) && f.y < 0
  ).length;
  const energyBoost = Math.round(15 + lowEnergyFactors * 6);

  // % riesgo enfermedad reducible
  const riskFactors = data.factors.filter(f =>
    ["smoke", "alcohol", "diet", "exercise"].includes(f.key) && f.y < 0
  ).length;
  const riskReduction = Math.round(20 + riskFactors * 6);

  // Score de potencial actual (0-95%)
  const potentialPct = Math.round(Math.min(95, Math.max(40, (data.expectancy / 95) * 100)));

  return { yearsToGain, energyBoost, riskReduction, potentialPct };
};

  // Con retos activos: mostrar progreso de cada una

    return s + (proto.yearsPotential || 0);

              +{totalPotential.toFixed(1)} años en juego

            {completedCount > 0 && (
              <p className="text-[12px] mt-1" style={{ color: C.inkSoft, lineHeight: 1.4, fontFamily: "Roboto, system-ui, sans-serif" }}>

            )}
          </div>
          {streak > 0 && (
            <div className="flex flex-col items-center justify-center px-3 py-2 rounded-2xl shrink-0" style={{ background: C.oliveBg }}>
              <span className="f-display" style={{ color: C.oliveD, fontSize: 18, fontWeight: 500, lineHeight: 1, letterSpacing: "-0.02em" }}>{streak}</span>

        {/* Retos activas con progreso */}
        <div className="space-y-3">
          {activeKeys.map((k) => {
            const biohack = BIOHACK_PILLARS.find(b => b.key === k);
            if (!biohack) return null;
            const tpl = QUEST_TEMPLATES[k] || {};
            const progress = getQuestProgress(k, questState, trackerHistory) || { current: 0, target: tpl.target || 21, pct: 0 };
            const isDoneToday = todayDone.includes(k);
            return (

const DonutChart = ({ value, max = 100, large = false }) => {
  const radius = 78;
  const strokeWidth = large ? 11 : 14;
  const circ = 2 * Math.PI * radius;
  const pct = Math.min(1, value / max);
  return (
    <div style={{ position: "relative", width: "100%", height: "100%" }}>
      <svg viewBox="0 0 200 200" style={{ width: "100%", height: "100%", display: "block" }} aria-hidden>
        {/* Track */}
        <circle cx="100" cy="100" r={radius} fill="none" stroke={C.oliveBg} strokeWidth={strokeWidth} />
        {/* Progress */}
        <circle cx="100" cy="100" r={radius} fill="none" stroke={C.olive} strokeWidth={strokeWidth}
          strokeLinecap="round"
          strokeDasharray={circ}
          strokeDashoffset={circ * (1 - pct)}
          transform="rotate(-90 100 100)"
          style={{ transition: "stroke-dashoffset 1.4s cubic-bezier(0.2, 0.7, 0.2, 1)" }} />
      </svg>
      {/* Center label — HTML overlay for proper typography control */}
      <div style={{
        position: "absolute", top: 0, left: 0, right: 0, bottom: 0,
        display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center",
        pointerEvents: "none",
      }}>
        <div className="f-display" style={{
          fontSize: large ? 64 : 48,
          fontWeight: 500,
          color: C.olive,
          lineHeight: 1,
          letterSpacing: "-0.02em",
        }}>
          {Math.round(value)}
        </div>
        <div className="f-body" style={{
          fontSize: large ? 13 : 12,
          color: C.inkSoft,
          fontWeight: 500,
          marginTop: 4,
          letterSpacing: "0.05em",
        }}>
          años
        </div>
      </div>
    </div>
  );
};

// URL pública de la app — cambiar este valor cuando se despliegue
// Si se deja vacío "", usa window.location.href automáticamente
const APP_URL = "";

// Texto que acompaña al enlace cuando se comparte
const SHARE_MESSAGE = "He descubierto EONIX, una app de biohacking basada en evidencia que te dice cómo vivir mejor y por más tiempo. Deberías probarla.";

const getShareUrl = () => {
  if (APP_URL && APP_URL.trim()) return APP_URL.trim();
  if (typeof window !== "undefined") return window.location.href;
  return "";
};

// Texto personalizado con nombre y resultado para WhatsApp
const buildPersonalShareMessage = ({ name, expectancy }) => {
  const url = getShareUrl();
  const intro = name
    ? `¡Hola! Soy ${name} y acabo de descubrir EONIX.`
    : `¡Hola! Acabo de descubrir EONIX.`;
  const result = expectancy
    ? ` Mi esperanza de vida estimada es de ${Math.round(expectancy)} años.`
    : "";
  return `${intro}${result} Es una app de biohacking basada en evidencia que te dice cómo vivir mejor y por más tiempo.\n\nHaz tu test gratis: ${url}`;
};

const shareApp = async (custom) => {
  const url = getShareUrl();
  const text = custom || SHARE_MESSAGE;
  const data = { title: "EONIX · Biohacking", text, url };

  if (typeof navigator !== "undefined" && navigator.share) {
    try {
      await navigator.share(data);
      return { success: true, method: "native" };
    } catch (err) {
      if (err && err.name === "AbortError") return { success: false, cancelled: true };
    }
  }

  // Fallback: copy to clipboard
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(`${text} ${url}`);
      return { success: true, method: "clipboard" };
    }
  } catch (e) { /* ignore */ }
  return { success: false, method: "none" };
};

const openShareUrl = (provider, customText) => {
  const url = getShareUrl();
  const baseText = customText || SHARE_MESSAGE;
  const text = customText ? customText : `${baseText} ${url}`;
  const links = {
    whatsapp: `https://wa.me/?text=${encodeURIComponent(text)}`,
    twitter:  `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`,
    telegram: `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(baseText)}`,
    email:    `mailto:?subject=${encodeURIComponent("EONIX — vive mejor, por más tiempo")}&body=${encodeURIComponent(text)}`,
  };
  if (links[provider]) window.open(links[provider], "_blank");
};

/* ============================================================
   TRACKER DE HÁBITOS — persistencia diaria
   Cache en módulo: localStorage.getItem cuesta 0.5-2ms y se
   llamaba en cada render. Cacheamos y invalidamos en saveAll/toggle.
   ============================================================ */
const TRACKER_KEY = "eonix.tracker.v1";
let _trackerCache = null;

const tracker = {
  loadAll() {
    if (_trackerCache !== null) return _trackerCache;
    try {
      const raw = localStorage.getItem(TRACKER_KEY);
      if (!raw) return (_trackerCache = { history: {}, streak: 0, lastDate: null });
      const data = JSON.parse(raw);
      _trackerCache = { history: data.history || {}, streak: data.streak || 0, lastDate: data.lastDate || null };
      return _trackerCache;
    } catch (e) {
      return (_trackerCache = { history: {}, streak: 0, lastDate: null });
    }
  },
  saveAll(payload) {
    // Cache invalidation: SIEMPRE creamos NUEVAS referencias en todos los niveles
    // para que React detecte el cambio via Object.is. Sin esto, los toggle del día
    // no re-renderizaban hasta refrescar la página manualmente.
    const newHistory = {};
    for (const k in (payload.history || {})) {
      newHistory[k] = [...(payload.history[k] || [])];
    }
    _trackerCache = {
      history: newHistory,
      streak: payload.streak || 0,
      lastDate: payload.lastDate || null
    };
    try { localStorage.setItem(TRACKER_KEY, JSON.stringify(_trackerCache)); } catch (e) {}
  },
  todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  },
  yesterdayKey() {
    const d = new Date(); d.setDate(d.getDate() - 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  },
  toggle(habitKey) {
    const all = this.loadAll();
    const today = this.todayKey();
    const todayList = all.history[today] || [];
    const isMarked = todayList.includes(habitKey);
    const newList = isMarked ? todayList.filter(k => k !== habitKey) : [...todayList, habitKey];
    all.history[today] = newList;

    // Update streak: cuenta días con al menos 1 hábito
    if (newList.length > 0 && all.lastDate !== today) {
      if (all.lastDate === this.yesterdayKey()) {
        all.streak = (all.streak || 0) + 1;
      } else if (all.lastDate !== today) {
        all.streak = 1;
      }
      all.lastDate = today;
    } else if (newList.length === 0 && all.lastDate === today) {
      // Si vuelven todos a sin marcar, podríamos resetear, pero conservemos
    }

    this.saveAll(all);
    return all;
  },
  toggleDay(habitKey, dateKey) {
    // Marca/desmarca un hábito en un día específico (presente o pasado)
    const all = this.loadAll();
    const list = all.history[dateKey] || [];
    const isMarked = list.includes(habitKey);
    const newList = isMarked ? list.filter(k => k !== habitKey) : [...list, habitKey];
    all.history[dateKey] = newList;

    // Si toca hoy y se está marcando algo, actualiza streak igual que toggle
    if (dateKey === this.todayKey() && newList.length > 0 && all.lastDate !== dateKey) {
      if (all.lastDate === this.yesterdayKey()) {
        all.streak = (all.streak || 0) + 1;
      } else {
        all.streak = 1;
      }
      all.lastDate = dateKey;
    }

    this.saveAll(all);
    return all;
  },
  getDay(dateKey) {
    return this.loadAll().history[dateKey] || [];
  },
  getToday() {
    const all = this.loadAll();
    return all.history[this.todayKey()] || [];
  },
  getStreak() {
    return this.loadAll().streak || 0;
  },
};

/* Hook que escucha cambios al tracker */
const useTracker = () => {
  const [state, setState] = useState(() => tracker.loadAll());
  const refresh = React.useCallback(() => setState(tracker.loadAll()), []);
  const toggleHabit = React.useCallback((key) => {
    tracker.toggle(key);
    refresh();
  }, [refresh]);
  const toggleHabitDay = React.useCallback((key, dateKey) => {
    tracker.toggleDay(key, dateKey);
    refresh();
  }, [refresh]);
  const today = state.history[tracker.todayKey()] || [];
  return { today, streak: state.streak || 0, toggle: toggleHabit, toggleDay: toggleHabitDay, history: state.history || {}, refresh };
};

/* Devuelve los 7 días de la semana actual (lunes-domingo) con metadata */
const getCurrentWeek = () => {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const dayOfWeek = today.getDay(); // 0=Domingo, 1=Lunes, ..., 6=Sábado
  // Calcular el lunes de esta semana
  const daysFromMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
  const monday = new Date(today);
  monday.setDate(today.getDate() - daysFromMonday);

  const labels = ["L", "M", "X", "J", "V", "S", "D"];
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const dateKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    return {
      date: d,
      dateKey,
      label: labels[i],
      isToday: d.getTime() === today.getTime(),
      isFuture: d.getTime() > today.getTime(),
      isPast: d.getTime() < today.getTime(),
    };
  });
};

/* Selecciona los 3 hábitos prioritarios para el usuario según sus debilidades */
const getPriorityHabits = (data) => {
  if (!data || !data.factors) return BIOHACK_PILLARS.slice(0, 3);
  const negativeKeys = data.factors.filter(f => f.y < 0).map(f => f.key);
  // Prioriza biohacks que atacan factores negativos
  const scored = BIOHACK_PILLARS.map(b => ({
    ...b,
    score: b.target.filter(t => negativeKeys.includes(t)).length,
  }));
  scored.sort((a, b) => {
    if (b.score !== a.score) return b.score - a.score;
    const aPot = (BIOHACK_PROTOCOLS[a.key] || {}).yearsPotential || 0;
    const bPot = (BIOHACK_PROTOCOLS[b.key] || {}).yearsPotential || 0;
    return bPot - aPot;
  });
  return scored.slice(0, 3);
};

const QUESTS_KEY = "eonix.quests.v1";

const quests = {
  load() {
    if (_questsCache !== null) return _questsCache;
    try {
      const raw = localStorage.getItem(QUESTS_KEY);
      if (!raw) return (_questsCache = { active: {}, completed: [] });
      const data = JSON.parse(raw);
      _questsCache = { active: data.active || {}, completed: data.completed || [] };
      return _questsCache;
    } catch (e) {
      return (_questsCache = { active: {}, completed: [] });
    }
  },
  save(state) {
    // Igual que tracker: nueva referencia en cada nivel para que React detecte cambios
    _questsCache = {
      active: { ...(state.active || {}) },
      completed: [...(state.completed || [])]
    };
    try { localStorage.setItem(QUESTS_KEY, JSON.stringify(_questsCache)); } catch (e) {}
  },
  activate(key) {
    const state = this.load();
    if (state.active[key]) return state;
    state.active[key] = { startedAt: tracker.todayKey(), target: (QUEST_TEMPLATES[key] || {}).target || 21 };
    this.save(state);
    return state;
  },
  abandon(key) {
    const state = this.load();
    delete state.active[key];
    this.save(state);
    return state;
  },
  complete(key) {
    const state = this.load();
    delete state.active[key];
    state.completed = state.completed || [];
    if (!state.completed.find(c => c.key === key)) {
      state.completed.push({ key, completedAt: tracker.todayKey() });
    }
    this.save(state);
    return state;
  },
  isActive(key) { return !!this.load().active[key]; },
  isCompleted(key) { return (this.load().completed || []).some(c => c.key === key); },
};

/* Calcula el progreso de un reto: días marcados desde startedAt */
const getQuestProgress = (key, questState, trackerHistory) => {
  const q = questState.active[key];
  if (!q) return null;
  let days = 0;
  for (const [date, list] of Object.entries(trackerHistory || {})) {
    if (date >= q.startedAt && Array.isArray(list) && list.includes(key)) {
      days++;
    }
  }
  const target = q.target || 21;
  const pct = Math.min(100, Math.round((days / target) * 100));
  return { current: days, target, pct, completed: days >= target };
};

  const abandon  = React.useCallback((key) => { quests.abandon(key);  refresh(); }, [refresh]);
  const complete = React.useCallback((key) => { quests.complete(key); refresh(); }, [refresh]);

  // Auto-completar retos que llegaron al objetivo
  const trackerState = tracker.loadAll();
  const activeKeys = Object.keys(state.active || {});
  React.useEffect(() => {
    activeKeys.forEach(k => {
      const p = getQuestProgress(k, state, trackerState.history);
      if (p && p.completed) {
        quests.complete(k);
        refresh();
      }
    });
  }, [activeKeys.join(","), trackerState.lastDate]);

  return { active: state.active, completed: state.completed || [], activate, abandon, complete, refresh };
};

        {tab === "done" && completedKeys.length === 0 && (

              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">

                Repetir

      </div>

      <ApicronFooter />

      {/* Modal preview de reto */}
      <QuestDetailModal
        questKey={previewKey}
        data={data}
        onClose={() => setPreviewKey(null)}
        onAccept={() => handleAcceptQuest(previewKey)}

      {/* Modal confirmación al abandonar reto */}
      {confirmAbandon && (() => {
        const biohack = BIOHACK_PILLARS.find(b => b.key === confirmAbandon);
        const tpl = QUEST_TEMPLATES[confirmAbandon] || {};
        const progress = getQuestProgress(confirmAbandon, { active: questHook.active }, trackerHistory) || { current: 0, target: tpl.target || 21 };
        return (
          <div className="anim-fadeIn"
            style={{
              position: "fixed", inset: 0, zIndex: 110,
              background: "rgba(38,34,28,0.55)",
              backdropFilter: "blur(8px)",
              display: "flex", alignItems: "center", justifyContent: "center",
              padding: 24,
            }}
            onClick={() => setConfirmAbandon(null)}>
            <div className="anim-scaleIn"
              onClick={e => e.stopPropagation()}
              style={{
                background: C.paper,
                borderRadius: 28,
                maxWidth: 360,
                width: "100%",
                padding: 24,
                boxShadow: "0 24px 60px -16px rgba(38,34,28,0.45)",
              }}>
              {/* Icono atención */}
              <div className="mx-auto mb-3" style={{
                width: 56, height: 56, borderRadius: 28,
                background: C.terra + "18",
                color: C.terraD,

                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                  <line x1="12" y1="9" x2="12" y2="13"/>
                  <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
              </div>

              <h3 className="f-display text-center mb-2" style={{ color: C.ink, fontSize: 20, fontWeight: 600, letterSpacing: "-0.022em" }}>
                ¿Abandonar este reto?
              </h3>

              <p className="text-center" style={{ color: C.inkSoft, fontSize: 13.5, lineHeight: 1.55, fontFamily: "Roboto, system-ui, sans-serif", fontWeight: 400 }}>
                {biohack ? <><strong style={{ color: C.ink, fontWeight: 600 }}>{biohack.title}</strong>. </> : ""}
                Llevas <strong style={{ color: C.olive, fontWeight: 600 }}>{progress.current} de {progress.target} días</strong>. Perderás todo el progreso, aunque podrás volver a empezar más tarde.
              </p>

              <div className="mt-5 grid grid-cols-2 gap-2">
                <button onClick={() => setConfirmAbandon(null)}
                  className="tap-soft py-3 rounded-full"
                  style={{
                    background: C.bgSoft,
                    color: C.ink,
                    border: `1px solid ${C.line}`,

                    fontWeight: 500,
                    fontFamily: "Roboto, system-ui, sans-serif",

                <button onClick={handleConfirmAbandon}
                  className="tap-soft py-3 rounded-full"
                  style={{
                    background: C.terra,
                    color: C.paper,
                    border: "none",
                    fontSize: 13.5,
                    fontWeight: 500,
                    fontFamily: "Roboto, system-ui, sans-serif",
                    boxShadow: `0 8px 20px -8px ${C.terra}`,
                  }}>
                  Sí, abandonar

      })()}

});

const FieldRow = ({ label, children }) => (
  <div>
    <div className="text-xs uppercase tracking-[0.18em] mb-2" style={{ color: C.inkSoft }}>{label}</div>

const FieldText = ({ value, onChange, placeholder, type = "text" }) => (
  <input type={type} value={value || ""} onChange={(e) => onChange(type === "number" ? (e.target.value === "" ? "" : parseInt(e.target.value, 10)) : e.target.value)}
    placeholder={placeholder}
    className="w-full px-4 py-2.5 rounded-xl text-base f-body outline-none"
    style={{ background: C.paper, border: `1px solid ${C.line}`, color: C.ink }} />
);

const FieldSelect = ({ value, onChange, options }) => (
  <select value={value || ""} onChange={(e) => onChange(e.target.value)}
    className="w-full px-4 py-2.5 rounded-xl text-base f-body outline-none appearance-none"
    style={{ background: C.paper, border: `1px solid ${C.line}`, color: C.ink, backgroundImage: `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235A5048' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>")`, backgroundRepeat: "no-repeat", backgroundPosition: "right 12px center", paddingRight: "40px" }}>
    <option value="" disabled>Selecciona…</option>
    {options.map(o => <option key={o.k} value={o.k}>{o.l}</option>)}
  </select>
);

const FieldChips = ({ value = [], onChange, options }) => {
  const toggle = (k) => {
    if (value.includes(k)) onChange(value.filter(v => v !== k));
    else onChange([...value, k]);
  };
  return (
    <div className="flex flex-wrap gap-2">
      {options.map(o => {
        const active = value.includes(o.k);
        return (
          <button key={o.k} onClick={() => toggle(o.k)}
            className="px-3 py-2 rounded-full text-sm tap-soft transition-all"
            style={{
              background: active ? C.olive : "rgba(250,246,236,0.95)",
              color: active ? C.paper : C.ink,
              border: `1px solid ${active ? C.olive : C.line}`,
              fontWeight: active ? 500 : 400,
            }}>
            {o.l}
          </button>
        );
      })}
    </div>
  );
};

/* ============================================================
   PERSISTENCIA — guardar datos del usuario en su dispositivo
   localStorage solo: nada sale del navegador del usuario
   ============================================================ */

const STORAGE_KEY = "eonix.user.v1";
const DEFAULT_DATA = {
  name: "",
  age: 30, gender: "",
  height: 170, weight: 70,
  country: "ES",
  civil: "", diet: "", exercise: "", alcohol: "",
  sleepHours: 7, sleep: "s79",
  stress: "", social: "", purpose: "",
  familyLongevity: "",
  conditions: [],
  bloodPressure: "",
  restingHR: 0,
  smoke: "",
};

// Helpers seguros — nunca rompen la app si localStorage no está disponible
const storage = {
  load() {
    try {
      if (typeof localStorage === "undefined") return null;
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      // Validación mínima: que tenga al menos nombre y género (datos básicos completados)
      if (!parsed || typeof parsed !== "object") return null;
      if (!parsed.data || !parsed.data.name || !parsed.data.gender) return null;
      return parsed;
    } catch (e) {
      console.warn("EONIX: error leyendo storage", e);
      return null;
    }
  },
  save(payload) {
    try {
      if (typeof localStorage === "undefined") return false;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      return true;
    } catch (e) {
      console.warn("EONIX: error guardando storage", e);
      return false;
    }
  },
  clear() {
    try {
      if (typeof localStorage === "undefined") return;
      localStorage.removeItem(STORAGE_KEY);
    } catch (e) { /* ignore */ }
  },
};

const App = () => {
  // Cargar datos persistidos al inicio (lazy initial state)
  const saved = React.useMemo(() => storage.load(), []);

  const [stage, setStage] = useState(saved ? "app" : "welcome"); // welcome | intro | name | onboarding | calc | app
  const [step, setStep] = useState(1);
  const [tab, setTab] = useState("home");
  const [subpage, setSubpage] = useState(null); // detail | compare | profile-x
  const [installOpen, setInstallOpen] = useState(false);
  const openInstall = () => setInstallOpen(true);
  const closeInstall = () => setInstallOpen(false);

  const [data, setData] = useState(saved?.data || DEFAULT_DATA);
  const [result, setResult] = useState(saved?.result || null);

  // Persistir automáticamente cada vez que data o result cambien (solo en stage "app")
  useEffect(() => {
    if (stage === "app" && data.name && data.gender) {
      storage.save({ data, result, savedAt: Date.now() });
    }
  }, [data, result, stage]);

  // Handlers memoizados con useCallback — necesario para que los componentes
  // hijos envueltos en React.memo no se re-rendericen cuando App re-renderiza.
  const update = React.useCallback((k) => (v) => setData(d => ({ ...d, [k]: v })), []);
  const next = React.useCallback(() => setStep(s => s + 1), []);
  const back = React.useCallback(() => {
    if (step === 1) { setStage("name"); return; }
    setStep(s => Math.max(1, s - 1));
  }, [step]);

  const startName = React.useCallback(() => setStage("name"), []);
  const startIntro = React.useCallback(() => setStage("intro"), []);
  const startOnboarding = React.useCallback(() => { setStage("onboarding"); setStep(1); }, []);
  const backFromName = React.useCallback(() => setStage("intro"), []);

  const restart = React.useCallback(() => {
    storage.clear();
    setStage("welcome");
    setStep(1);
    setTab("home");
    setSubpage(null);
    setResult(null);
    setData(DEFAULT_DATA);
  }, []);

  // Recalcular cuando se actualizan datos desde el perfil
  const recalculate = React.useCallback((newData) => {
    setData(newData);
    const r = calculateLifespan(newData);
    setResult(r);
    storage.save({ data: newData, result: r, savedAt: Date.now() });
  }, []);

  const handleTabChange = React.useCallback((t) => { setTab(t); setSubpage(null); }, []);
  const handleShare = React.useCallback(() => shareApp(), []);

  // ─────────────────────────────────────────────────────────────
  // BACK BUTTON DEL NAVEGADOR — atrapamos el back para que NO salga de la app.
  // En su lugar, retrocede dentro del propio flujo (subpage/tab/step/stage).
  // ─────────────────────────────────────────────────────────────
  const handleBackRef = React.useRef(() => {});
  // Mantén la lógica al día con el state actual usando un useEffect sin deps array vacío.
  useEffect(() => {
    handleBackRef.current = () => {
      if (installOpen)            { setInstallOpen(false); return; }
      if (subpage)                { setSubpage(null); return; }
      if (stage === "app") {
        if (tab !== "home")       { setTab("home"); return; }
        return; // en home: no hacer nada, queda atrapado
      }
      if (stage === "calc")       { return; } // durante el cálculo no retrocede
      if (stage === "onboarding") {
        if (step > 1)             { setStep(s => Math.max(1, s - 1)); return; }
        setStage("name"); return;
      }
      if (stage === "name")       { setStage("intro"); return; }
      if (stage === "intro")      { setStage("welcome"); return; }
      // stage === "welcome": permanecer dentro de la app
    };
  });
  // Instala el listener UNA SOLA VEZ (mount/unmount).
  useEffect(() => {
    // Empuja un estado-trampa para capturar el primer back.
    try { window.history.pushState({ eonix: "trap" }, ""); } catch (e) {}
    const onPop = () => {
      // Re-empujamos inmediatamente para mantener la trampa activa.
      try { window.history.pushState({ eonix: "trap" }, ""); } catch (e) {}
      try { handleBackRef.current && handleBackRef.current(); } catch (e) {}
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);

  // Después del último paso, transición a "calc"
  useEffect(() => {
    if (stage === "onboarding" && step > 14) {
      setStage("calc");
    }
  }, [stage, step]);

  // En "calc", esperar y mostrar el resultado.
  // calculateLifespan es bulletproof (nunca lanza), pero envolvemos por
  // si alguna versión guardada antigua provoca un edge-case inesperado.
  const calcDataRef = useRef(data);
  useEffect(() => { calcDataRef.current = data; }, [data]);
  useEffect(() => {
    if (stage !== "calc") return;
    const t = setTimeout(() => {
      let r;
      try {
        r = calculateLifespan(calcDataRef.current);
      } catch (e) {
        console.error("[EONIX] calc transition recovered:", e);
        r = calculateLifespan({}); // fallback con defaults
      }
      setResult(r);
      setStage("app"); // SIEMPRE pasamos a la app — nunca quedarse colgado
    }, 700); // Antes 2500ms — el cálculo real es <10ms; mantenemos 700ms por percepción
    return () => clearTimeout(t);
  }, [stage]);

  // Scroll reset on step change
  useEffect(() => {
    const el = document.querySelector(".scroll-area");
    if (el) el.scrollTop = 0;
  }, [step, stage, tab, subpage]);

  // Si llegamos a "app" sin result (sesión guardada incompleta) — recalcular
  useEffect(() => {
    if (stage === "app" && !result) {
      try {
        setResult(calculateLifespan(data));
      } catch (e) {
        console.error("[EONIX] recalc recovered:", e);
        setResult(calculateLifespan({}));
      }
    }
  }, [stage, result]); // eslint-disable-line react-hooks/exhaustive-deps

  let content = null;

  if (stage === "welcome") {
    content = <Welcome onNext={startIntro} onInstall={openInstall} />;
  } else if (stage === "intro") {
    content = <IntroSlides onComplete={startName} />;
  } else if (stage === "name") {
    content = <StepName value={data.name} onChange={update("name")} onBack={backFromName} onNext={startOnboarding} />;
  } else if (stage === "onboarding") {
    const common = { onBack: back, onNext: next };
    if (step === 1)  content = <StepGender    value={data.gender}   onChoose={update("gender")}    {...common} />;
    if (step === 2)  content = <StepAge       value={data.age}      onChange={update("age")}       {...common} />;
    if (step === 3)  content = <StepBody      height={data.height}  weight={data.weight}  onHeight={update("height")} onWeight={update("weight")} {...common} />;
    if (step === 4)  content = <StepCountry   value={data.country}  onChoose={update("country")}   {...common} />;
    if (step === 5)  content = <StepCivil     value={data.civil}    onChoose={update("civil")}     {...common} />;
    if (step === 6)  content = <StepDiet      value={data.diet}     onChoose={update("diet")}      {...common} />;
    if (step === 7)  content = <StepExercise  value={data.exercise} onChoose={update("exercise")}  {...common} />;
    if (step === 8)  content = <StepAlcohol   value={data.alcohol}  onChoose={update("alcohol")}   {...common} />;
    if (step === 9)  content = <StepSleep     hours={data.sleepHours} onHours={update("sleepHours")} value={data.sleep} onChoose={update("sleep")} {...common} />;
    if (step === 10) content = <StepStress    value={data.stress}   onChoose={update("stress")}    {...common} />;
    if (step === 11) content = <StepSocial    value={data.social}   onChoose={update("social")}    {...common} />;
    if (step === 12) content = <StepPurpose   value={data.purpose}  onChoose={update("purpose")}   {...common} />;
    if (step === 13) content = <StepFamily    value={data.familyLongevity} onChoose={update("familyLongevity")} {...common} />;
    if (step === 14) content = <StepSmoke     value={data.smoke}    onChoose={update("smoke")}     {...common} />;
  } else if (stage === "calc") {
    content = <Calculating />;
  } else if (stage === "app" && !result) {
    content = <Calculating />;
  } else if (stage === "app" && result) {
    let main;
    if (tab === "home") {
      if (subpage === "detail")       main = <DetailScreen  data={result} onBack={() => setSubpage(null)} onCompare={() => setSubpage("compare")} />;
      else if (subpage === "compare") main = <CompareScreen data={result} onBack={() => setSubpage("detail")} />;
      else                            main = <HomeTab       data={{ ...result, name: data.name }} onRestart={restart} onDetail={() => setSubpage("detail")} onCompare={() => setSubpage("compare")} onShare={() => shareApp()} onGoHabits={() => setTab("habits")} />;
    } else if (tab === "habits") {
      main = <BiohacksTab data={result} onShare={() => {}} />;
    } else if (tab === "zones") {
      main = <ZonesTab data={result} />;
    } else if (tab === "profile") {
      if (subpage === "info") {
        main = <MyInfoScreen data={data} onBack={() => setSubpage(null)}
                  onSave={(newData) => { recalculate(newData); setSubpage(null); }} />;
      } else if (subpage === "results") {
        main = <DetailScreen data={result} onBack={() => setSubpage(null)} onCompare={() => setSubpage("compare-from-profile")} />;
      } else if (subpage === "compare-from-profile") {
        main = <CompareScreen data={result} onBack={() => setSubpage("results")} />;
      } else {
        main = <ProfileTab data={data} onRestart={restart} onSubpage={(k) => setSubpage(k)} onInstall={openInstall} onShare={() => shareApp()} />;
      }
    }
    // Fallback si no se ha asignado main (tab desconocido)
    if (!main) main = <Calculating />;
    content = (
      <React.Fragment>
        {main}
        <BottomNav active={tab} onChange={(t) => { setTab(t); setSubpage(null); }} />
      </React.Fragment>
    );
  }

  // Garantía absoluta: nunca renderizar `null` como contenido
  // (eso provocaba la pantalla en blanco si algún stage caía en un hueco)
  if (!content) {
    content = <Calculating />;
  }

  return (
    <div className="app-shell">
      {content}
      <InstallSheet open={installOpen} onClose={closeInstall} />
    </div>
  );
};

/* ============================================================
   ERROR BOUNDARY — captura crashes de render para que NO
   desmonte el árbol entero (lo que provocaba el 'volverse atrás')
   ============================================================ */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null, info: null };
  }
  static getDerivedStateFromError(error) {
    return { error: error };
  }
  componentDidCatch(error, info) {
    console.error("[EONIX] ErrorBoundary atrapó un error:", error, info);
    this.setState({ info });
  }
  reset = () => {
    try {
      localStorage.removeItem("eonix.user.v1");
      localStorage.removeItem("eonix.tracker.v1");
      localStorage.removeItem("eonix.quests.v1");
    } catch(e) {}
    this.setState({ error: null, info: null });
    window.location.reload();
  };
  render() {
    if (this.state.error) {
      const errMsg = String(this.state.error && this.state.error.message || this.state.error);
      const errStack = String(this.state.error && this.state.error.stack || "");
      const compStack = String(this.state.info && this.state.info.componentStack || "");
      return (
        <div style={{
          minHeight: "100vh",
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "flex-start",
          padding: "32px 20px 60px",
          background: "#F4EFE2",
          color: "#2A2620",
          fontFamily: "Roboto, system-ui, sans-serif",
          textAlign: "center",
          overflowY: "auto",
        }}>
          <div style={{ fontSize: 40, marginBottom: 12, marginTop: 24 }}>🌿</div>
          <h2 style={{ fontSize: 20, marginBottom: 10, fontWeight: 500 }}>
            Algo no ha cargado bien
          </h2>
          <p style={{ fontSize: 13, lineHeight: 1.5, marginBottom: 16, maxWidth: 320, opacity: 0.75 }}>
            Pulsa "Reiniciar" para empezar de cero. Si el problema persiste, manda una captura del error de abajo.
          </p>
          <button
            onClick={this.reset}
            style={{
              background: "#5A6E45",
              color: "#FAF6EC",
              border: "none",
              padding: "12px 26px",
              borderRadius: 999,
              fontSize: 14,
              fontWeight: 500,
              cursor: "pointer",
              boxShadow: "0 8px 24px -8px rgba(90,110,69,0.5)",
              marginBottom: 18,
            }}
          >
            Reiniciar la app (borra datos)
          </button>

          {/* Error VISIBLE por defecto — sin desplegable */}
          <div style={{
            width: "100%",
            maxWidth: 560,
            background: "#fff",
            border: "1px solid #ddd",
            borderRadius: 8,
            padding: 12,
            textAlign: "left",
            fontSize: 11,
            fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
            color: "#5a3030",
            overflow: "auto",
          }}>
            <div style={{ fontWeight: 700, marginBottom: 6 }}>Error:</div>
            <div style={{ marginBottom: 12, wordBreak: "break-word" }}>{errMsg}</div>
            {compStack && (
              <>
                <div style={{ fontWeight: 700, marginBottom: 6 }}>Componente:</div>
                <pre style={{ whiteSpace: "pre-wrap", margin: 0, fontSize: 10, lineHeight: 1.4 }}>{compStack.trim().slice(0, 800)}</pre>
              </>
            )}
            {errStack && (
              <>
                <div style={{ fontWeight: 700, marginTop: 12, marginBottom: 6 }}>Stack:</div>
                <pre style={{ whiteSpace: "pre-wrap", margin: 0, fontSize: 10, lineHeight: 1.4 }}>{errStack.slice(0, 800)}</pre>
              </>
            )}
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
</script>

<!-- ============================================================
     SERVICE WORKER — DESACTIVADO INTENCIONADAMENTE
     ─────────────────────────────────────────────────
     El Service Worker estaba sirviendo HTML cacheado y
     bloqueando las actualizaciones. Lo matamos por completo
     y NO registramos uno nuevo. La app funciona como una
     web normal (los datos siguen guardándose en localStorage,
     que NO es del SW). Si en el futuro quieres re-activar
     PWA/offline, hay que reescribir sw.js con estrategia
     network-first y bumpear el cacheName.
     ============================================================ -->
<script>
(function killSW() {
  if (!('serviceWorker' in navigator)) return;
  // Desregistra cualquier SW que haya quedado vivo
  navigator.serviceWorker.getRegistrations()
    .then(function(regs) {
      regs.forEach(function(r) {
        r.unregister().then(function(ok) {
          if (ok) console.log('[EONIX] SW antiguo desregistrado.');
        });
      });
    })
    .catch(function(e) {
      console.warn('[EONIX] No se pudo desregistrar el SW:', e);
    });
  // Limpia cualquier caché residual del SW
  if (typeof caches !== 'undefined' && caches.keys) {
    caches.keys().then(function(keys) {
      keys.forEach(function(k) { caches.delete(k); });
    }).catch(function(){});
  }
})();
</script>
