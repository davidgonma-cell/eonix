          EONIX es una herramienta educativa, <strong style={{ color: C.ink, fontWeight: 600 }}>no es un diagnóstico médico</strong>. La esperanza de vida que calcula es una estimación estadística, no un pronóstico individual. Si tienes condiciones de salud específicas, consulta siempre a un profesional sanitario antes de cambiar tu dieta, ejercicio o medicación.
        </div>

        {/* PIE */}
        <div style={{
          marginTop: 28, textAlign: "center",
          fontSize: 11, color: C.inkSoft, opacity: 0.7,
          fontFamily: "Roboto, system-ui, sans-serif", lineHeight: 1.6,
        }}>
          Hecho con cuidado · 2026<br/>
          EONIX · Biohacking basado en evidencia
        </div>
      </div>
    </div>
  );
};

const App = () => {
  // Cargar datos persistidos al inicio (lazy initial state)
  const saved = React.useMemo(() => storage.load(), []);

  const [stage, setStage] = useState(saved ? "app" : "welcome"); // welcome | intro | name | onboarding | calc | app
  const [step, setStep] = useState(1);
  const [tab, setTab] = useState("home");
  const [subpage, setSubpage] = useState(null); // detail | compare | profile-x
  const [installOpen, setInstallOpen] = useState(false);
  const [langOpen, setLangOpen] = useState(false);
  const openInstall = () => setInstallOpen(true);
  const closeInstall = () => setInstallOpen(false);
  const openLang = React.useCallback(() => setLangOpen(true), []);
  const closeLang = React.useCallback(() => setLangOpen(false), []);

  // Idioma persistido en localStorage (independiente del resto del estado)
  const [lang, setLangState] = useState(() => {
    try {
      if (typeof localStorage === "undefined") return "es";
      return localStorage.getItem(LANG_KEY) || "es";
    } catch (e) { return "es"; }
  });
  const setLang = React.useCallback((code) => {
    try { localStorage.setItem(LANG_KEY, code); } catch (e) {}
    setLangState(code);
  }, []);
  const langContextValue = React.useMemo(() => ({ lang, setLang, openSheet: openLang }), [lang, setLang, openLang]);

  const [data, setData] = useState(saved?.data || DEFAULT_DATA);
  const [result, setResult] = useState(saved?.result || null);

  // Persistir automáticamente cada vez que data o result cambien (solo en stage "app")
  useEffect(() => {
    if (stage === "app" && data.name && data.gender) {
      storage.save({ data, result, savedAt: Date.now() });
    }
  }, [data, result, stage]);

  // Handlers memoizados con useCallback — necesario para que los componentes
  // hijos envueltos en React.memo no se re-rendericen cuando App re-renderiza.
  const update = React.useCallback((k) => (v) => setData(d => ({ ...d, [k]: v })), []);
  const next = React.useCallback(() => setStep(s => s + 1), []);
  const back = React.useCallback(() => {
    if (step === 1) { setStage("name"); return; }
    setStep(s => Math.max(1, s - 1));
  }, [step]);

  const startName = React.useCallback(() => setStage("name"), []);
  const startIntro = React.useCallback(() => setStage("intro"), []);
  const startOnboarding = React.useCallback(() => { setStage("onboarding"); setStep(1); }, []);
  const backFromName = React.useCallback(() => setStage("intro"), []);

  const restart = React.useCallback(() => {
    storage.clear();
    setStage("welcome");
    setStep(1);
    setTab("home");
    setSubpage(null);
    setResult(null);
    setData(DEFAULT_DATA);
  }, []);

  // Recalcular cuando se actualizan datos desde el perfil
  const recalculate = React.useCallback((newData) => {
    setData(newData);
    const r = calculateLifespan(newData);
    setResult(r);
    storage.save({ data: newData, result: r, savedAt: Date.now() });
  }, []);

  const handleTabChange = React.useCallback((t) => { setTab(t); setSubpage(null); }, []);
  const handleShare = React.useCallback(() => shareApp(), []);

  // ─────────────────────────────────────────────────────────────
  // BACK BUTTON DEL NAVEGADOR — atrapamos el back para que NO salga de la app.
  // En su lugar, retrocede dentro del propio flujo (subpage/tab/step/stage).
  // ─────────────────────────────────────────────────────────────
  const handleBackRef = React.useRef(() => {});
  // Mantén la lógica al día con el state actual usando un useEffect sin deps array vacío.
  useEffect(() => {
    handleBackRef.current = () => {
      if (langOpen)               { setLangOpen(false); return; }
      if (installOpen)            { setInstallOpen(false); return; }
      if (subpage)                { setSubpage(null); return; }
      if (stage === "app") {
        if (tab !== "home")       { setTab("home"); return; }
        return; // en home: no hacer nada, queda atrapado
      }
      if (stage === "calc")       { return; } // durante el cálculo no retrocede
      if (stage === "onboarding") {
        if (step > 1)             { setStep(s => Math.max(1, s - 1)); return; }
        setStage("name"); return;
      }
      if (stage === "name")       { setStage("intro"); return; }
      if (stage === "intro")      { setStage("welcome"); return; }
      // stage === "welcome": permanecer dentro de la app
    };
  });
  // Instala el listener UNA SOLA VEZ (mount/unmount).
  useEffect(() => {
    // Empuja un estado-trampa para capturar el primer back.
    try { window.history.pushState({ eonix: "trap" }, ""); } catch (e) {}
    const onPop = () => {
      // Re-empujamos inmediatamente para mantener la trampa activa.
      try { window.history.pushState({ eonix: "trap" }, ""); } catch (e) {}
      try { handleBackRef.current && handleBackRef.current(); } catch (e) {}
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);

  // Después del último paso, transición a "calc"
  useEffect(() => {
    if (stage === "onboarding" && step > 14) {
      setStage("calc");
    }
  }, [stage, step]);

  // En "calc", esperar y mostrar el resultado.
  // calculateLifespan es bulletproof (nunca lanza), pero envolvemos por
  // si alguna versión guardada antigua provoca un edge-case inesperado.
  const calcDataRef = useRef(data);
  useEffect(() => { calcDataRef.current = data; }, [data]);
  useEffect(() => {
    if (stage !== "calc") return;
    const t = setTimeout(() => {
      let r;
      try {
        r = calculateLifespan(calcDataRef.current);
      } catch (e) {
        console.error("[EONIX] calc transition recovered:", e);
        r = calculateLifespan({}); // fallback con defaults
      }
      setResult(r);
      setStage("app"); // SIEMPRE pasamos a la app — nunca quedarse colgado
    }, 700); // Antes 2500ms — el cálculo real es <10ms; mantenemos 700ms por percepción
    return () => clearTimeout(t);
  }, [stage]);

  // Scroll reset on step change
  useEffect(() => {
    const el = document.querySelector(".scroll-area");
    if (el) el.scrollTop = 0;
  }, [step, stage, tab, subpage]);

  // Si llegamos a "app" sin result (sesión guardada incompleta) — recalcular
  useEffect(() => {
    if (stage === "app" && !result) {
      try {
        setResult(calculateLifespan(data));
      } catch (e) {
        console.error("[EONIX] recalc recovered:", e);
        setResult(calculateLifespan({}));
      }
    }
  }, [stage, result]); // eslint-disable-line react-hooks/exhaustive-deps

  let content = null;

  if (stage === "welcome") {
    content = <Welcome onNext={startIntro} onInstall={openInstall} />;
  } else if (stage === "intro") {
    content = <IntroSlides onComplete={startName} />;
  } else if (stage === "name") {
    content = <StepName value={data.name} onChange={update("name")} onBack={backFromName} onNext={startOnboarding} />;
  } else if (stage === "onboarding") {
    const common = { onBack: back, onNext: next };
    if (step === 1)  content = <StepGender    value={data.gender}   onChoose={update("gender")}    {...common} />;
    if (step === 2)  content = <StepAge       value={data.age}      onChange={update("age")}       {...common} />;
    if (step === 3)  content = <StepBody      height={data.height}  weight={data.weight}  onHeight={update("height")} onWeight={update("weight")} {...common} />;
    if (step === 4)  content = <StepCountry   value={data.country}  onChoose={update("country")}   {...common} />;
    if (step === 5)  content = <StepCivil     value={data.civil}    onChoose={update("civil")}     {...common} />;
    if (step === 6)  content = <StepDiet      value={data.diet}     onChoose={update("diet")}      {...common} />;
    if (step === 7)  content = <StepExercise  value={data.exercise} onChoose={update("exercise")}  {...common} />;
    if (step === 8)  content = <StepAlcohol   value={data.alcohol}  onChoose={update("alcohol")}   {...common} />;
    if (step === 9)  content = <StepSleep     hours={data.sleepHours} onHours={update("sleepHours")} value={data.sleep} onChoose={update("sleep")} {...common} />;
    if (step === 10) content = <StepStress    value={data.stress}   onChoose={update("stress")}    {...common} />;
    if (step === 11) content = <StepSocial    value={data.social}   onChoose={update("social")}    {...common} />;
    if (step === 12) content = <StepPurpose   value={data.purpose}  onChoose={update("purpose")}   {...common} />;
    if (step === 13) content = <StepFamily    value={data.familyLongevity} onChoose={update("familyLongevity")} {...common} />;
    if (step === 14) content = <StepSmoke     value={data.smoke}    onChoose={update("smoke")}     {...common} />;
  } else if (stage === "calc") {
    content = <Calculating />;
  } else if (stage === "app" && !result) {
    content = <Calculating />;
  } else if (stage === "app" && result) {
    let main;
    if (tab === "home") {
      if (subpage === "detail")       main = <DetailScreen  data={result} onBack={() => setSubpage(null)} onCompare={() => setSubpage("compare")} />;
      else if (subpage === "compare") main = <CompareScreen data={result} onBack={() => setSubpage("detail")} />;
      else                            main = <HomeTab       data={{ ...result, name: data.name }} onRestart={restart} onDetail={() => setSubpage("detail")} onCompare={() => setSubpage("compare")} onShare={() => shareApp()} onGoHabits={() => setTab("habits")} />;
    } else if (tab === "habits") {
      main = <BiohacksTab data={result} onShare={() => {}} />;
    } else if (tab === "zones") {
      main = <ZonesTab data={result} />;
    } else if (tab === "profile") {
      if (subpage === "info") {
        main = <MyInfoScreen data={data} onBack={() => setSubpage(null)}
                  onSave={(newData) => { recalculate(newData); setSubpage(null); }} />;
      } else if (subpage === "results") {
        main = <DetailScreen data={result} onBack={() => setSubpage(null)} onCompare={() => setSubpage("compare-from-profile")} />;
      } else if (subpage === "compare-from-profile") {
        main = <CompareScreen data={result} onBack={() => setSubpage("results")} />;
      } else if (subpage === "habits") {
        main = <MyHabitsExplainScreen
                  onBack={() => setSubpage(null)}
                  onGoHabits={() => { setSubpage(null); setTab("habits"); }} />;
      } else if (subpage === "reminders") {
        main = <RemindersExplainScreen
                  onBack={() => setSubpage(null)}
                  onInstall={openInstall} />;
      } else if (subpage === "about") {
        main = <AboutAppScreen onBack={() => setSubpage(null)} />;
      } else {
        main = <ProfileTab data={data} onRestart={restart} onSubpage={(k) => setSubpage(k)} onInstall={openInstall} onShare={() => shareApp()} onLangOpen={openLang} />;
      }
    }
    // Fallback si no se ha asignado main (tab desconocido)
    if (!main) main = <Calculating />;
    content = (
      <React.Fragment>
        {main}
        <BottomNav active={tab} onChange={(t) => { setTab(t); setSubpage(null); }} />
      </React.Fragment>
    );
  }

  // Garantía absoluta: nunca renderizar `null` como contenido
  // (eso provocaba la pantalla en blanco si algún stage caía en un hueco)
  if (!content) {
    content = <Calculating />;
  }

  return (
    <LangContext.Provider value={langContextValue}>
      <div className="app-shell">
        {content}
        <InstallSheet open={installOpen} onClose={closeInstall} />
        <LanguageSheet open={langOpen} onClose={closeLang} />
      </div>
    </LangContext.Provider>
  );
};

/* ============================================================
   ERROR BOUNDARY — captura crashes de render para que NO
   desmonte el árbol entero (lo que provocaba el 'volverse atrás')
   ============================================================ */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null, info: null };
  }
  static getDerivedStateFromError(error) {
    return { error: error };
  }
  componentDidCatch(error, info) {
    console.error("[EONIX] ErrorBoundary atrapó un error:", error, info);
    this.setState({ info });
  }
  reset = () => {
    try {
      localStorage.removeItem("eonix.user.v1");
      localStorage.removeItem("eonix.tracker.v1");
      localStorage.removeItem("eonix.quests.v1");
    } catch(e) {}
    this.setState({ error: null, info: null });
    window.location.reload();
  };
  render() {
    if (this.state.error) {
      const errMsg = String(this.state.error && this.state.error.message || this.state.error);
      const errStack = String(this.state.error && this.state.error.stack || "");
      const compStack = String(this.state.info && this.state.info.componentStack || "");
      return (
        <div style={{
          minHeight: "100vh",
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "flex-start",
          padding: "32px 20px 60px",
          background: "#F4EFE2",
          color: "#2A2620",
          fontFamily: "Roboto, system-ui, sans-serif",
          textAlign: "center",
          overflowY: "auto",
        }}>
          <div style={{ fontSize: 40, marginBottom: 12, marginTop: 24 }}>🌿</div>
          <h2 style={{ fontSize: 20, marginBottom: 10, fontWeight: 500 }}>
            Algo no ha cargado bien
          </h2>
          <p style={{ fontSize: 13, lineHeight: 1.5, marginBottom: 16, maxWidth: 320, opacity: 0.75 }}>
            Pulsa "Reiniciar" para empezar de cero. Si el problema persiste, manda una captura del error de abajo.
          </p>
          <button
            onClick={this.reset}
            style={{
              background: "#5A6E45",
              color: "#FAF6EC",
              border: "none",
              padding: "12px 26px",
              borderRadius: 999,
              fontSize: 14,
              fontWeight: 500,
              cursor: "pointer",
              boxShadow: "0 8px 24px -8px rgba(90,110,69,0.5)",
              marginBottom: 18,
            }}
          >
            Reiniciar la app (borra datos)
          </button>

          {/* Error VISIBLE por defecto — sin desplegable */}
          <div style={{
            width: "100%",
            maxWidth: 560,
            background: "#fff",
            border: "1px solid #ddd",
            borderRadius: 8,
            padding: 12,
            textAlign: "left",
            fontSize: 11,
            fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
            color: "#5a3030",
            overflow: "auto",
          }}>
            <div style={{ fontWeight: 700, marginBottom: 6 }}>Error:</div>
            <div style={{ marginBottom: 12, wordBreak: "break-word" }}>{errMsg}</div>
            {compStack && (
              <>
                <div style={{ fontWeight: 700, marginBottom: 6 }}>Componente:</div>
                <pre style={{ whiteSpace: "pre-wrap", margin: 0, fontSize: 10, lineHeight: 1.4 }}>{compStack.trim().slice(0, 800)}</pre>
              </>
            )}
            {errStack && (
              <>
                <div style={{ fontWeight: 700, marginTop: 12, marginBottom: 6 }}>Stack:</div>
                <pre style={{ whiteSpace: "pre-wrap", margin: 0, fontSize: 10, lineHeight: 1.4 }}>{errStack.slice(0, 800)}</pre>
              </>
            )}
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
</script>

<!-- ============================================================
     SERVICE WORKER — DESACTIVADO INTENCIONADAMENTE
     ─────────────────────────────────────────────────
     El Service Worker estaba sirviendo HTML cacheado y
     bloqueando las actualizaciones. Lo matamos por completo
     y NO registramos uno nuevo. La app funciona como una
     web normal (los datos siguen guardándose en localStorage,
     que NO es del SW). Si en el futuro quieres re-activar
     PWA/offline, hay que reescribir sw.js con estrategia
     network-first y bumpear el cacheName.
     ============================================================ -->
<script>
(function killSW() {
  if (!('serviceWorker' in navigator)) return;
  // Desregistra cualquier SW que haya quedado vivo
  navigator.serviceWorker.getRegistrations()
    .then(function(regs) {
      regs.forEach(function(r) {
        r.unregister().then(function(ok) {
          if (ok) console.log('[EONIX] SW antiguo desregistrado.');
        });
      });
    })
    .catch(function(e) {
      console.warn('[EONIX] No se pudo desregistrar el SW:', e);
    });
  // Limpia cualquier caché residual del SW
  if (typeof caches !== 'undefined' && caches.keys) {
    caches.keys().then(function(keys) {
      keys.forEach(function(k) { caches.delete(k); });
    }).catch(function(){});
  }
})();
</script>
