<!-- ===== FORCE CACHE RESET (v6 — full i18n surface + bug fixes) ===== -->
<script>
(function() {
  var EONIX_VERSION = "v22-2026-05-06-daily-reminder-banner";
  try {
    var stored = localStorage.getItem("eonix_app_version");
    if (stored !== EONIX_VERSION) {
      localStorage.setItem("eonix_app_version", EONIX_VERSION);
      // Solo si HABÍA una versión previa (no en primera instalación)
      if (stored !== null) {
        var cleanups = [];
        if ("serviceWorker" in navigator) {
          cleanups.push(navigator.serviceWorker.getRegistrations().then(function(regs) {
            return Promise.all(regs.map(function(r) { return r.unregister(); }));
          }));
        }
        if (typeof caches !== "undefined" && caches.keys) {
          cleanups.push(caches.keys().then(function(keys) {
            return Promise.all(keys.map(function(k) { return caches.delete(k); }));
          }));
        }
        // Recargar SIEMPRE que la versión cambie, haya o no Service Worker.
        // Antes este reload estaba dentro del if(serviceWorker), así que en
        // navegadores sin SW (o al abrir desde file://content://) los usuarios
        // se quedaban en la versión vieja aunque hubieran descargado la nueva.
        Promise.all(cleanups).then(function() {
          console.log("[EONIX] Cache limpiada. Recargando con la nueva versión.");
          window.location.reload();
        }).catch(function(e) {
          console.warn("[EONIX] Limpieza de caché falló, recargando igualmente:", e);
          window.location.reload();
        });
      }
    }
  } catch (e) {
    console.warn("[EONIX] version check failed:", e);
  }
})();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ============================================================
   PALETA
   ============================================================ */
const C = {
  // Backgrounds — beige cálido más limpio, menos amarillento
  bg: "#F5F0E5", bgSoft: "#FAF7EF", paper: "#FFFFFF", paper2: "#F2EDE2",
  // Olive — sage más suave y elegante
  olive: "#7A8A5C", oliveD: "#5F6E45", oliveL: "#9CAB7E", oliveBg: "#E5EAD8",
  // Terra — más coral/clay, menos saturado
  terra: "#C28169", terraD: "#A66951", terraL: "#D9A38C",
  // Ink — más profundo y cálido
  ink: "#26221C", inkSoft: "#65605A", line: "#E5DDCD",
  // Gold — más miel suave
  gold: "#C9A766", sky: "#C8D2D1",
};

// Fondo "agua/burbujas" — capas de radial-gradients que producen un efecto orgánico fluido,

  "habits.gainCard.title":{ es: "Lo que ganas con cada reto",                en: "What you gain with each challenge",        de: "Was du mit jeder Challenge gewinnst",   fr: "Ce que tu gagnes avec chaque défi",      it: "Cosa guadagni con ogni sfida",          pt: "O que ganhas com cada desafio" },
  "habits.gainCard.body":{ es: "No se trata de añadir años a tu vida — se trata de añadir <strong>vida a tus años</strong>. Cada reto cumplido entrena tu cuerpo, tu mente y tus relaciones para que llegues a tu edad estimada con <strong>más energía, más agilidad y más propósito</strong>. Pequeñas decisiones diarias que se acumulan en décadas de vitalidad.", en: "It's not about adding years to your life — it's about adding <strong>life to your years</strong>. Every challenge you complete trains your body, mind and relationships so you reach your estimated age with <strong>more energy, more agility and more purpose</strong>. Small daily decisions that add up to decades of vitality.", de: "Es geht nicht darum, Jahre zu deinem Leben hinzuzufügen — es geht darum, <strong>Leben zu deinen Jahren</strong> hinzuzufügen. Jede abgeschlossene Challenge trainiert deinen Körper, deinen Geist und deine Beziehungen, damit du dein geschätztes Alter mit <strong>mehr Energie, mehr Beweglichkeit und mehr Sinn</strong> erreichst. Kleine tägliche Entscheidungen, die sich zu Jahrzehnten voller Vitalität summieren.", fr: "Il ne s'agit pas d'ajouter des années à ta vie — il s'agit d'ajouter <strong>de la vie à tes années</strong>. Chaque défi accompli entraîne ton corps, ton esprit et tes relations pour que tu atteignes ton âge estimé avec <strong>plus d'énergie, plus d'agilité et plus de sens</strong>. De petites décisions quotidiennes qui s'accumulent en décennies de vitalité.", it: "Non si tratta di aggiungere anni alla tua vita — si tratta di aggiungere <strong>vita ai tuoi anni</strong>. Ogni sfida completata allena il tuo corpo, la tua mente e le tue relazioni perché tu arrivi alla tua età stimata con <strong>più energia, più agilità e più scopo</strong>. Piccole decisioni quotidiane che si accumulano in decenni di vitalità.", pt: "Não se trata de adicionar anos à tua vida — trata-se de adicionar <strong>vida aos teus anos</strong>. Cada desafio cumprido treina o teu corpo, a tua mente e as tuas relações para que chegues à tua idade estimada com <strong>mais energia, mais agilidade e mais propósito</strong>. Pequenas decisões diárias que se acumulam em décadas de vitalidade." },

  // Texts (one per insight)
  "ins.text.morningLight": { es: "Si te expones a la luz natural en los primeros 30 min tras despertar, dormirás mejor esta noche.", en: "If you get natural light in the first 30 min after waking, you'll sleep better tonight.", de: "Wenn du in den ersten 30 Min. nach dem Aufwachen natürliches Licht bekommst, schläfst du heute Nacht besser.", fr: "Une exposition à la lumière naturelle dans les 30 premières min après le réveil te fera mieux dormir ce soir.", it: "Esponiti alla luce naturale nei primi 30 min dopo il risveglio: dormirai meglio stanotte.", pt: "Apanha luz natural nos primeiros 30 min após acordar e dormirás melhor esta noite." },
  "ins.text.naturalMove":  { es: "Las personas más longevas del mundo no van al gimnasio: caminan, suben escaleras y se mueven todo el día.", en: "The world's longest-lived people don't go to the gym: they walk, climb stairs and move all day.", de: "Die langlebigsten Menschen gehen nicht ins Fitnessstudio: sie gehen, steigen Treppen und bewegen sich den ganzen Tag.", fr: "Les personnes les plus âgées du monde ne vont pas à la salle : elles marchent, montent des escaliers, bougent toute la journée.", it: "Le persone più longeve non vanno in palestra: camminano, salgono scale e si muovono tutto il giorno.", pt: "As pessoas mais longevas do mundo não vão ao ginásio: caminham, sobem escadas e movem-se o dia inteiro." },
  "ins.text.purposeYears": { es: "Tener una razón clara para levantarte cada mañana añade hasta 7 años de vida con la mente clara.", en: "Having a clear reason to get up each morning adds up to 7 years of life with a clear mind.", de: "Einen klaren Grund zum Aufstehen zu haben, schenkt bis zu 7 Jahre mit klarem Kopf.", fr: "Avoir une raison claire de se lever chaque matin ajoute jusqu'à 7 années avec un esprit clair.", it: "Avere una ragione chiara per alzarsi ogni mattina aggiunge fino a 7 anni con la mente lucida.", pt: "Ter uma razão clara para te levantares cada manhã soma até 7 anos com a mente clara." },
  "ins.text.postmealWalk": { es: "Caminar 10 minutos después de comer reduce el pico de azúcar en sangre un 20%.", en: "A 10-minute walk after a meal cuts the blood sugar spike by 20%.", de: "10 Min. Spaziergang nach dem Essen senken den Blutzuckeranstieg um 20%.", fr: "Une marche de 10 minutes après le repas réduit le pic de glycémie de 20%.", it: "Camminare 10 minuti dopo aver mangiato riduce il picco di glicemia del 20%.", pt: "Caminhar 10 minutos após a refeição reduz o pico de açúcar no sangue em 20%." },
  "ins.text.harvardRel":   { es: "El estudio Harvard de 85 años concluye: la calidad de tus relaciones predice tu salud mejor que el colesterol.", en: "Harvard's 85-year study found: the quality of your relationships predicts your health better than cholesterol.", de: "Die 85-Jahres-Studie aus Harvard zeigt: Beziehungsqualität sagt deine Gesundheit besser voraus als Cholesterin.", fr: "L'étude de Harvard sur 85 ans conclut : la qualité de tes relations prédit ta santé mieux que le cholestérol.", it: "Lo studio di Harvard di 85 anni conclude: la qualità delle tue relazioni predice la salute meglio del colesterolo.", pt: "O estudo de 85 anos de Harvard conclui: a qualidade das tuas relações prevê a tua saúde melhor que o colesterol." },
  "ins.text.physSigh":     { es: "Un suspiro fisiológico (doble inhalación + exhalación larga, 5 veces) baja el estrés en 2 minutos.", en: "A physiological sigh (double inhale + long exhale, 5 times) drops stress in 2 minutes.", de: "Ein physiologischer Seufzer (doppeltes Einatmen + langes Ausatmen, 5×) senkt Stress in 2 Min.", fr: "Un soupir physiologique (double inspiration + longue expiration, 5 fois) réduit le stress en 2 min.", it: "Un sospiro fisiologico (doppia inspirazione + lunga espirazione, 5 volte) abbassa lo stress in 2 minuti.", pt: "Um suspiro fisiológico (dupla inspiração + expiração longa, 5 vezes) reduz o stress em 2 minutos." },
  "ins.text.oliveOil":     { es: "Cinco cucharadas de aceite de oliva virgen extra al día: −30% eventos cardiovasculares.", en: "Five tablespoons of extra virgin olive oil a day: −30% cardiovascular events.", de: "Fünf Esslöffel natives Olivenöl extra pro Tag: −30% kardiovaskuläre Ereignisse.", fr: "Cinq cuillères d'huile d'olive vierge extra par jour : −30% d'événements cardiovasculaires.", it: "Cinque cucchiai di olio extravergine d'oliva al giorno: −30% eventi cardiovascolari.", pt: "Cinco colheres de azeite virgem extra por dia: −30% de eventos cardiovasculares." },
  "ins.text.okiRetire":    { es: "En Okinawa no existe la palabra «jubilación». Tu propósito te mantiene joven.", en: "In Okinawa there's no word for «retirement». Purpose keeps you young.", de: "In Okinawa gibt es kein Wort für „Ruhestand“. Sinn hält dich jung.", fr: "À Okinawa, le mot « retraite » n'existe pas. Ton but te garde jeune.", it: "A Okinawa non esiste la parola «pensione». Lo scopo ti mantiene giovane.", pt: "Em Okinawa não existe a palavra «reforma». O propósito mantém-te jovem." },
  "ins.text.laughCortisol":{ es: "Reírte con alguien cercano libera endorfinas y reduce el cortisol durante horas.", en: "Laughing with someone close releases endorphins and lowers cortisol for hours.", de: "Mit einem engen Menschen zu lachen, schüttet Endorphine aus und senkt Cortisol stundenlang.", fr: "Rire avec un proche libère des endorphines et baisse le cortisol pendant des heures.", it: "Ridere con qualcuno vicino rilascia endorfine e riduce il cortisolo per ore.", pt: "Rir com alguém próximo liberta endorfinas e reduz o cortisol durante horas." },
  "ins.text.lonelyHeart":  { es: "La soledad crónica daña tu corazón tanto como fumar 15 cigarrillos al día.", en: "Chronic loneliness harms your heart as much as smoking 15 cigarettes a day.", de: "Chronische Einsamkeit schadet dem Herz wie 15 Zigaretten am Tag.", fr: "La solitude chronique nuit au cœur autant que 15 cigarettes par jour.", it: "La solitudine cronica danneggia il cuore quanto fumare 15 sigarette al giorno.", pt: "A solidão crónica prejudica o coração tanto como fumar 15 cigarros por dia." },
  "ins.text.muscle30":     { es: "Después de los 30, perdemos 1% de masa muscular al año si no entrenamos fuerza. Nunca es tarde para empezar.", en: "After 30, we lose 1% of muscle mass per year if we don't train strength. It's never too late.", de: "Nach 30 verlieren wir 1% Muskelmasse pro Jahr ohne Krafttraining. Es ist nie zu spät.", fr: "Après 30 ans, on perd 1% de masse musculaire par an sans renforcement. Il n'est jamais trop tard.", it: "Dopo i 30 perdiamo l'1% di massa muscolare l'anno senza forza. Mai troppo tardi per iniziare.", pt: "Depois dos 30, perdemos 1% de massa muscular por ano sem treino de força. Nunca é tarde." },
  "ins.text.med10":        { es: "10 minutos de meditación al día son tan efectivos como sesiones largas, según los estudios.", en: "10 minutes of daily meditation are as effective as longer sessions, studies show.", de: "10 Min. Meditation am Tag sind laut Studien so wirksam wie lange Sitzungen.", fr: "10 minutes de méditation par jour sont aussi efficaces que de longues séances, selon les études.", it: "10 minuti di meditazione al giorno sono efficaci quanto sessioni lunghe, secondo gli studi.", pt: "10 minutos de meditação por dia são tão eficazes quanto sessões longas, segundo os estudos." },
  "ins.text.sleepCold":    { es: "Dormir menos de 6 horas multiplica por 4 el riesgo de resfriado. Tu mejor sistema inmune es la cama.", en: "Sleeping under 6 hours quadruples your cold risk. Your best immune system is your bed.", de: "Weniger als 6 Std. Schlaf vervierfachen das Erkältungsrisiko. Dein bestes Immunsystem ist das Bett.", fr: "Moins de 6 h de sommeil multiplie par 4 le risque de rhume. Ton meilleur système immunitaire, c'est ton lit.", it: "Dormire meno di 6 ore quadruplica il rischio di raffreddore. Il miglior sistema immunitario è il letto.", pt: "Dormir menos de 6 horas multiplica por 4 o risco de constipação. O teu melhor sistema imunitário é a cama." },
  "ins.text.sardFamily":   { es: "En Cerdeña, las personas mayores viven con sus familias. La compañía protege la mente y el corazón.", en: "In Sardinia, elders live with their families. Companionship protects the mind and the heart.", de: "In Sardinien leben Ältere mit ihren Familien. Gesellschaft schützt Geist und Herz.", fr: "En Sardaigne, les aînés vivent avec leurs familles. La compagnie protège l'esprit et le cœur.", it: "In Sardegna gli anziani vivono con le famiglie. La compagnia protegge mente e cuore.", pt: "Na Sardenha, os mais velhos vivem com as famílias. A companhia protege a mente e o coração." },

  "zones.msg.mid":   { es: "Tu esperanza estimada es de <strong>{y} años</strong>. Te separan {d} años de la media en Zonas Azules — y sus hábitos son replicables.", en: "Your estimated life expectancy is <strong>{y} years</strong>. You're {d} years from the Blue Zone average — and their habits are replicable.", de: "Deine geschätzte Lebenserwartung beträgt <strong>{y} Jahre</strong>. Es trennen dich {d} Jahre vom Schnitt der Blauen Zonen — und ihre Gewohnheiten sind übertragbar.", fr: "Ton espérance estimée est de <strong>{y} ans</strong>. Tu es à {d} ans de la moyenne des Zones bleues — et leurs habitudes sont reproductibles.", it: "La tua aspettativa stimata è di <strong>{y} anni</strong>. Sei a {d} anni dalla media delle Zone Blu — e le loro abitudini sono replicabili.", pt: "A tua esperança estimada é de <strong>{y} anos</strong>. Estás a {d} anos da média das Zonas Azuis — e os hábitos delas são replicáveis." },
  "zones.msg.low":   { es: "Tu esperanza estimada es de <strong>{y} años</strong>. La buena noticia: la mayor parte de la diferencia con las Zonas Azules está en hábitos que puedes empezar hoy.", en: "Your estimated life expectancy is <strong>{y} years</strong>. The good news: most of the gap with the Blue Zones lies in habits you can start today.", de: "Deine geschätzte Lebenserwartung beträgt <strong>{y} Jahre</strong>. Die gute Nachricht: Der Großteil des Abstands zu den Blauen Zonen sind Gewohnheiten, die du heute beginnen kannst.", fr: "Ton espérance estimée est de <strong>{y} ans</strong>. Bonne nouvelle : l'essentiel de l'écart avec les Zones bleues tient à des habitudes que tu peux commencer aujourd'hui.", it: "La tua aspettativa stimata è di <strong>{y} anni</strong>. La buona notizia: la maggior parte della differenza con le Zone Blu sta in abitudini che puoi iniziare oggi.", pt: "A tua esperança estimada é de <strong>{y} anos</strong>. A boa notícia: a maior parte da diferença para as Zonas Azuis está em hábitos que podes começar hoje." },

  "zones.tip.high":  { es: "Estás en territorio Zona Azul — tus hábitos te equiparan con los lugares más longevos del mundo.", en: "You're in Blue Zone territory — your habits put you on par with the world's longest-lived places.", de: "Du bist im Blauen-Zonen-Gebiet — deine Gewohnheiten stellen dich auf eine Stufe mit den langlebigsten Orten der Welt.", fr: "Tu es en territoire Zone bleue — tes habitudes te placent au niveau des lieux les plus longévives du monde.", it: "Sei in territorio Zona Blu — le tue abitudini ti pongono al livello dei luoghi più longevi del mondo.", pt: "Estás em território Zona Azul — os teus hábitos colocam-te ao nível dos lugares mais longevos do mundo." },

  // === BLUE ZONES — names + tags + descriptions ===
  "zone.okinawa.name":  { es: "Okinawa, Japón",         en: "Okinawa, Japan",         de: "Okinawa, Japan",          fr: "Okinawa, Japon",          it: "Okinawa, Giappone",     pt: "Okinawa, Japão" },
  "zone.okinawa.tag":   { es: "Vida plena a cualquier edad", en: "Full life at any age",   de: "Erfülltes Leben in jedem Alter", fr: "Une vie pleine à tout âge", it: "Vita piena a ogni età", pt: "Vida plena em qualquer idade" },
  "zone.okinawa.desc":  { es: "Las mujeres más longevas del mundo viven aquí. Tres pilares: Ikigai (un propósito que da sentido a cada mañana), moai (círculos de amigos que duran toda la vida) y hara hachi bu (dejar de comer al 80% de saciedad). Su dieta es rica en boniato morado, tofu, algas y verduras de su huerto. Trabajan en el campo o el huerto hasta edades muy avanzadas: el movimiento natural sustituye al gimnasio.", en: "The world's longest-lived women live here. Three pillars: Ikigai (a purpose that gives meaning to every morning), moai (lifelong circles of friends) and hara hachi bu (stop eating at 80% fullness). Their diet is rich in purple sweet potato, tofu, seaweed and home-grown vegetables. They work the fields or garden into old age: natural movement replaces the gym.", de: "Die langlebigsten Frauen der Welt leben hier. Drei Säulen: Ikigai (ein Sinn, der jedem Morgen Bedeutung gibt), Moai (lebenslange Freundeskreise) und hara hachi bu (mit 80% Sättigung aufhören zu essen). Ihre Ernährung ist reich an violetten Süßkartoffeln, Tofu, Algen und Gemüse aus dem Garten. Sie arbeiten bis ins hohe Alter im Feld oder Garten: Natürliche Bewegung ersetzt das Fitnessstudio.", fr: "Les femmes les plus longévives du monde vivent ici. Trois piliers : Ikigai (un but qui donne du sens à chaque matin), moai (cercles d'amis pour la vie) et hara hachi bu (arrêter de manger à 80% de satiété). Leur alimentation est riche en patate douce violette, tofu, algues et légumes du potager. Ils travaillent les champs ou le jardin jusqu'à un âge avancé : le mouvement naturel remplace la salle.", it: "Le donne più longeve del mondo vivono qui. Tre pilastri: Ikigai (uno scopo che dà senso a ogni mattina), moai (cerchie di amici per la vita) e hara hachi bu (smettere di mangiare all'80% di sazietà). La loro dieta è ricca di patata dolce viola, tofu, alghe e verdure dell'orto. Lavorano nei campi o nell'orto fino a età avanzata: il movimento naturale sostituisce la palestra.", pt: "As mulheres mais longevas do mundo vivem aqui. Três pilares: Ikigai (um propósito que dá sentido a cada manhã), moai (círculos de amigos para toda a vida) e hara hachi bu (parar de comer a 80% de saciedade). A sua dieta é rica em batata-doce roxa, tofu, algas e legumes da horta. Trabalham no campo ou na horta até idades avançadas: o movimento natural substitui o ginásio." },
  "zone.sardinia.name": { es: "Cerdeña, Italia",        en: "Sardinia, Italy",        de: "Sardinien, Italien",      fr: "Sardaigne, Italie",       it: "Sardegna, Italia",       pt: "Sardenha, Itália" },
  "zone.sardinia.tag":  { es: "Tradición, familia y propósito", en: "Tradition, family and purpose", de: "Tradition, Familie und Sinn", fr: "Tradition, famille et but", it: "Tradizione, famiglia e scopo", pt: "Tradição, família e propósito" },
  "zone.sardinia.desc": { es: "La única zona azul donde los hombres viven tanto como las mujeres. Pastores que caminan kilómetros de terreno escarpado a diario. Vino tinto Cannonau (3x más antioxidantes que el común) en cada comida con familia. Quesos de oveja con grasa Omega-3, pan carasau y leche de cabra. La familia es el centro absoluto: los abuelos viven con hijos y nietos.", en: "The only Blue Zone where men live as long as women. Shepherds walk kilometers of steep terrain every day. Cannonau red wine (3× the antioxidants of regular wine) at every meal with family. Sheep cheeses rich in Omega-3, carasau bread and goat milk. Family is the absolute center: grandparents live with their children and grandchildren.", de: "Die einzige Blaue Zone, in der Männer so lange leben wie Frauen. Hirten laufen täglich Kilometer durch steiles Gelände. Cannonau-Rotwein (3× mehr Antioxidantien als üblich) zu jeder Mahlzeit mit Familie. Schafskäse mit Omega-3, Carasau-Brot und Ziegenmilch. Die Familie steht im Mittelpunkt: Großeltern leben mit Kindern und Enkeln.", fr: "La seule Zone bleue où les hommes vivent autant que les femmes. Des bergers parcourent des kilomètres de terrain escarpé chaque jour. Vin rouge Cannonau (3× plus d'antioxydants que la normale) à chaque repas en famille. Fromages de brebis riches en Oméga-3, pain carasau et lait de chèvre. La famille est le centre absolu : les grands-parents vivent avec enfants et petits-enfants.", it: "L'unica Zona Blu dove gli uomini vivono quanto le donne. Pastori che camminano chilometri su terreni scoscesi ogni giorno. Vino rosso Cannonau (3× gli antiossidanti del normale) a ogni pasto in famiglia. Formaggi di pecora ricchi di Omega-3, pane carasau e latte di capra. La famiglia è il centro assoluto: i nonni vivono con figli e nipoti.", pt: "A única Zona Azul onde os homens vivem tanto como as mulheres. Pastores que caminham quilómetros de terreno acidentado todos os dias. Vinho tinto Cannonau (3× mais antioxidantes que o normal) em cada refeição com a família. Queijos de ovelha ricos em Ómega-3, pão carasau e leite de cabra. A família é o centro absoluto: os avós vivem com filhos e netos." },
  "zone.icaria.name":   { es: "Icaria, Grecia",         en: "Ikaria, Greece",         de: "Ikaria, Griechenland",    fr: "Icarie, Grèce",           it: "Icaria, Grecia",         pt: "Icária, Grécia" },
  "zone.icaria.tag":    { es: "Comunidad y vida sencilla", en: "Community and simple life", de: "Gemeinschaft & einfaches Leben", fr: "Communauté et vie simple", it: "Comunità e vita semplice", pt: "Comunidade e vida simples" },
  "zone.icaria.desc":   { es: "Tasas de demencia un 75% menores que en EE.UU. Dieta mediterránea pura: aceite de oliva virgen, verduras silvestres, legumbres y poco azúcar. Siesta diaria de 30 minutos (reduce el riesgo cardíaco un 37%). Té de hierbas locales con propiedades antiinflamatorias. Sin reloj: la gente come, descansa y socializa cuando el cuerpo lo pide.", en: "Dementia rates 75% lower than in the U.S. A pure Mediterranean diet: virgin olive oil, wild greens, legumes and little sugar. A daily 30-minute nap (37% lower heart risk). Local herbal teas with anti-inflammatory effects. No clock: people eat, rest and socialize when the body asks.", de: "Demenzraten 75% niedriger als in den USA. Reine Mittelmeerdiät: natives Olivenöl, Wildkräuter, Hülsenfrüchte, wenig Zucker. Tägliches 30-Minuten-Schläfchen (37% niedrigeres Herzrisiko). Lokale Kräutertees mit entzündungshemmender Wirkung. Ohne Uhr: Man isst, ruht und trifft sich, wenn der Körper es verlangt.", fr: "Taux de démence 75% inférieurs aux É.-U. Régime méditerranéen pur : huile d'olive vierge, légumes sauvages, légumineuses, peu de sucre. Sieste quotidienne de 30 minutes (−37% de risque cardiaque). Tisanes locales aux propriétés anti-inflammatoires. Sans horloge : on mange, on se repose et on socialise quand le corps le demande.", it: "Tassi di demenza del 75% inferiori agli USA. Dieta mediterranea pura: olio d'oliva vergine, verdure selvatiche, legumi e poco zucchero. Pisolino quotidiano di 30 minuti (riduce il rischio cardiaco del 37%). Tisane locali con proprietà antinfiammatorie. Senza orologio: si mangia, si riposa e si socializza quando il corpo lo chiede.", pt: "Taxas de demência 75% mais baixas do que nos EUA. Dieta mediterrânica pura: azeite virgem, verduras silvestres, leguminosas e pouco açúcar. Sesta diária de 30 minutos (reduz o risco cardíaco em 37%). Chás de ervas locais com propriedades anti-inflamatórias. Sem relógio: come-se, descansa-se e socializa-se quando o corpo pede." },
  "zone.nicoya.name":   { es: "Nicoya, Costa Rica",     en: "Nicoya, Costa Rica",     de: "Nicoya, Costa Rica",      fr: "Nicoya, Costa Rica",      it: "Nicoya, Costa Rica",     pt: "Nicoya, Costa Rica" },
  "zone.nicoya.tag":    { es: "Pura vida y propósito",  en: "Pura vida and purpose",  de: "Pura vida und Sinn",      fr: "Pura vida et but",        it: "Pura vida e scopo",      pt: "Pura vida e propósito" },
  "zone.nicoya.desc":   { es: "Plan de vida fuerte (su versión del Ikigai): saber por qué te levantas cada mañana. Dieta del trío mesoamericano — maíz nixtamalizado, frijol negro y calabaza — combinación con todos los aminoácidos esenciales. Agua del subsuelo rica en calcio y magnesio. Vínculos familiares estrechos: comer juntos cada día y vivir cerca de hijos y nietos.", en: "A strong «plan de vida» (their Ikigai): knowing why you get up each morning. The Mesoamerican trio — nixtamalized corn, black beans and squash — provides all essential amino acids. Underground water rich in calcium and magnesium. Tight family ties: eating together daily and living near children and grandchildren.", de: "Ein starker „plan de vida“ (ihr Ikigai): wissen, warum man jeden Morgen aufsteht. Die mesoamerikanische Trias — nixtamalisierter Mais, schwarze Bohnen und Kürbis — liefert alle essenziellen Aminosäuren. Grundwasser reich an Kalzium und Magnesium. Enge Familienbande: täglich gemeinsam essen und in der Nähe von Kindern und Enkeln leben.", fr: "Un fort « plan de vida » (leur Ikigai) : savoir pourquoi tu te lèves chaque matin. Le trio mésoaméricain — maïs nixtamalisé, haricot noir et courge — fournit tous les acides aminés essentiels. Eau souterraine riche en calcium et magnésium. Liens familiaux étroits : manger ensemble chaque jour et vivre près des enfants et petits-enfants.", it: "Forte «plan de vida» (il loro Ikigai): sapere perché ti alzi ogni mattina. Il trio mesoamericano — mais nixtamalizzato, fagioli neri e zucca — fornisce tutti gli amminoacidi essenziali. Acqua sotterranea ricca di calcio e magnesio. Legami familiari stretti: mangiare insieme ogni giorno e vivere vicino a figli e nipoti.", pt: "Forte «plan de vida» (o seu Ikigai): saber porque te levantas cada manhã. O trio mesoamericano — milho nixtamalizado, feijão preto e abóbora — combinação com todos os aminoácidos essenciais. Água subterrânea rica em cálcio e magnésio. Vínculos familiares próximos: comer juntos todos os dias e viver perto de filhos e netos." },
  "zone.loma.name":     { es: "Loma Linda, California", en: "Loma Linda, California", de: "Loma Linda, Kalifornien", fr: "Loma Linda, Californie",  it: "Loma Linda, California", pt: "Loma Linda, Califórnia" },
  "zone.loma.tag":      { es: "Fe, comunidad, descanso", en: "Faith, community, rest", de: "Glaube, Gemeinschaft, Ruhe", fr: "Foi, communauté, repos", it: "Fede, comunità, riposo", pt: "Fé, comunidade, descanso" },
  "zone.loma.desc":     { es: "Comunidad adventista que vive de promedio 10 años más que el resto de Estados Unidos. Dieta mayoritariamente plant-based con frutos secos diarios (5 raciones por semana reduce mortalidad un 30%). Sábado de descanso completo: una pausa semanal sagrada para familia, naturaleza y reflexión. La comunidad religiosa actúa como red social y fuente de propósito.", en: "An Adventist community that lives on average 10 years longer than the rest of the U.S. A largely plant-based diet with daily nuts (5 servings a week cut mortality by 30%). A full sabbath of rest: a sacred weekly pause for family, nature and reflection. The religious community acts as a social network and source of purpose.", de: "Eine adventistische Gemeinde, die im Schnitt 10 Jahre länger lebt als der Rest der USA. Eine überwiegend pflanzenbasierte Ernährung mit täglichen Nüssen (5 Portionen pro Woche senken die Sterblichkeit um 30%). Ein voller Ruhetag (Sabbat): eine heilige wöchentliche Pause für Familie, Natur und Reflexion. Die religiöse Gemeinschaft ist ein soziales Netz und eine Quelle des Sinns.", fr: "Une communauté adventiste qui vit en moyenne 10 ans de plus que le reste des États-Unis. Une alimentation surtout végétale avec des fruits à coque quotidiens (5 portions/semaine réduisent la mortalité de 30%). Un sabbat complet de repos : une pause hebdomadaire sacrée pour famille, nature et réflexion. La communauté religieuse sert de réseau social et de source de sens.", it: "Una comunità avventista che vive in media 10 anni più del resto degli USA. Dieta prevalentemente vegetale con frutta secca quotidiana (5 porzioni a settimana riducono la mortalità del 30%). Un sabato di riposo completo: una pausa settimanale sacra per famiglia, natura e riflessione. La comunità religiosa funge da rete sociale e fonte di scopo.", pt: "Uma comunidade adventista que vive em média 10 anos mais que o resto dos EUA. Dieta maioritariamente plant-based com frutos secos diários (5 porções por semana reduzem a mortalidade em 30%). Um sábado de descanso completo: uma pausa semanal sagrada para família, natureza e reflexão. A comunidade religiosa funciona como rede social e fonte de propósito." },
};

  if (!entry) return key;
  return entry[lang] || entry.es || key;
};
const useT = () => {
  const { lang } = useLang();
  return React.useCallback((key) => t(key, lang), [lang]);
};

/* Botón reutilizable: bandera + código de idioma + chevron.
   Se coloca en Welcome, OnboardingShell y HomeTab para que el usuario
   pueda cambiar de idioma desde cualquier punto antes (y durante) el onboarding. */
const LanguageFlagButton = ({ light = true, compact = false, style = {} }) => {
  const { lang, openSheet } = useLang();
  const tx = useT();
  const currentLang = LANGUAGES.find(l => l.code === lang) || LANGUAGES[0];
  const txtColor = light ? "#FAF6EC" : C.ink;
  const bg = light ? "rgba(255,255,255,0.18)" : "rgba(38,34,28,0.06)";
  const border = light ? "rgba(255,255,255,0.28)" : "rgba(38,34,28,0.12)";
  return (
    <button
      onClick={openSheet}
      aria-label={tx("lang.title")}
      className="tap-soft flex items-center gap-1.5"
      style={{
        padding: compact ? "5px 8px 5px 6px" : "7px 10px 7px 8px",
        borderRadius: 999,

        border: `1px solid ${border}`,

        cursor: "pointer",

      <span style={{
        fontSize: compact ? 10.5 : 11.5,

        color: txtColor,

/* ============================================================
   FALLBACK PARA IMÁGENES QUE NO CARGAN
   En lugar de dejar un hueco vacío, aplicamos un gradient
   temático con la paleta de marca al contenedor padre.
   Uso:  onError={imgFallback("olive")}  (o "terra", "gold", "warm", "cool")
   ============================================================ */
const FALLBACK_GRADIENTS = {
  olive: `linear-gradient(135deg, #9CAB7E 0%, #5F6E45 100%)`,
  terra: `linear-gradient(135deg, #D9A38C 0%, #A66951 100%)`,
  gold:  `linear-gradient(135deg, #E8C896 0%, #C9A766 100%)`,
  warm:  `linear-gradient(135deg, #C9A766 0%, #C28169 100%)`,
  cool:  `linear-gradient(135deg, #C8D2D1 0%, #7A8A5C 100%)`,
  earth: `linear-gradient(135deg, #C8BAA0 0%, #7A8A5C 100%)`,
};
const imgFallback = (theme = "olive") => (e) => {
  const el = e.currentTarget;
  el.style.display = "none";
  const parent = el.parentElement;
  if (parent && !parent.dataset.fallback) {
    parent.dataset.fallback = "1";
    parent.style.background = FALLBACK_GRADIENTS[theme] || FALLBACK_GRADIENTS.olive;
    // Suaviza con una textura de "burbujas" sobre el gradient
    parent.style.backgroundImage = `radial-gradient(circle 200px at 30% 30%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 70%), radial-gradient(circle 150px at 80% 80%, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 70%), ${FALLBACK_GRADIENTS[theme] || FALLBACK_GRADIENTS.olive}`;
  }
};

/* Country baselines (OMS 2024 — esperanza de vida al nacer, redondeada) */
const COUNTRY_BASE = {
  ES: { name: "España",          M: 81.0, F: 86.3 },
  MX: { name: "México",          M: 73.5, F: 79.4 },
  AR: { name: "Argentina",       M: 76.1, F: 80.6 },
  CO: { name: "Colombia",        M: 75.0, F: 81.2 },
  CL: { name: "Chile",           M: 78.5, F: 83.5 },
  PE: { name: "Perú",            M: 74.4, F: 79.8 },
  VE: { name: "Venezuela",       M: 70.6, F: 78.2 },
  EC: { name: "Ecuador",         M: 75.8, F: 81.0 },
  UY: { name: "Uruguay",         M: 75.0, F: 81.7 },
  US: { name: "Estados Unidos",  M: 76.4, F: 81.2 },
  CA: { name: "Canadá",          M: 80.3, F: 84.5 },
  GB: { name: "Reino Unido",     M: 79.0, F: 82.9 },
  FR: { name: "Francia",         M: 79.7, F: 85.1 },
  DE: { name: "Alemania",        M: 78.9, F: 83.4 },
  IT: { name: "Italia",          M: 81.1, F: 85.2 },
  PT: { name: "Portugal",        M: 78.4, F: 84.5 },
  JP: { name: "Japón",           M: 81.5, F: 87.6 },
  OTHER: { name: "Otro país",    M: 78.0, F: 83.0 },
};

/* Cálculo: IMC + país + hábitos + genética + condiciones
   ───────────────────────────────────────────────────────
   IMPORTANTE: Esta función NUNCA debe lanzar excepciones.
   Si hay datos faltantes, mal tipados o NaN, se aplican
   valores por defecto seguros y se devuelve un resultado
   válido. Si todo lo demás falla, se devuelve un resultado
   mínimo del país "OTHER". */
const calculateLifespan = (rawData) => {
  // 1) Coerción segura de TODOS los inputs (nunca throws)
  const r = rawData && typeof rawData === "object" ? rawData : {};
  const toInt = (v, def) => {
    const n = typeof v === "number" ? v : parseInt(v, 10);
    return Number.isFinite(n) ? n : def;
  };
  const toStr = (v) => (typeof v === "string" ? v : "");
  const safe = {
    age:       Math.max(14, Math.min(108, toInt(r.age, 30))),
    gender:    r.gender === "F" ? "F" : r.gender === "M" ? "M" : "M",
    height:    Math.max(120, Math.min(230, toInt(r.height, 170))),
    weight:    Math.max(30,  Math.min(250, toInt(r.weight, 70))),
    country:   COUNTRY_BASE[toStr(r.country)] ? toStr(r.country) : "OTHER",
    civil:     toStr(r.civil),
    diet:      toStr(r.diet),
    exercise:  toStr(r.exercise),
    alcohol:   toStr(r.alcohol),
    sleep:     toStr(r.sleep),
    stress:    toStr(r.stress),
    social:    toStr(r.social),
    purpose:   toStr(r.purpose),
    familyLongevity: toStr(r.familyLongevity),
    smoke:     toStr(r.smoke),
    conditions:    Array.isArray(r.conditions) ? r.conditions.filter(c => typeof c === "string") : [],
    bloodPressure: toStr(r.bloodPressure),
    restingHR:     Math.max(0, Math.min(220, toInt(r.restingHR, 0))),
  };

  try {
    const country = COUNTRY_BASE[safe.country] || COUNTRY_BASE.OTHER;
    let base = safe.gender === "F" ? country.F : country.M;
    const factors = [];

    // --- IMC real (altura cm + peso kg) ---
    const heightM = safe.height / 100;
    const bmi = heightM > 0 ? safe.weight / (heightM * heightM) : 22;
    let bmiYears, bmiLabel;
    if (bmi < 18.5)        { bmiYears = -2; bmiLabel = `IMC ${bmi.toFixed(1)} — Bajo peso`; }
    else if (bmi < 25)     { bmiYears = 1.5; bmiLabel = `IMC ${bmi.toFixed(1)} — Saludable`; }
    else if (bmi < 30)     { bmiYears = -1.5; bmiLabel = `IMC ${bmi.toFixed(1)} — Sobrepeso`; }
    else if (bmi < 35)     { bmiYears = -4; bmiLabel = `IMC ${bmi.toFixed(1)} — Obesidad I`; }
    else                   { bmiYears = -8; bmiLabel = `IMC ${bmi.toFixed(1)} — Obesidad severa`; }
    factors.push({ key: "bmi", y: bmiYears, l: bmiLabel, cat: "Cuerpo (IMC)", group: "diet" });

    // --- Tabaco (basado en NEJM, Jha 2013) ---
    const smk = {
      never:      { y: 0,    l: "No fumas" },
      occasional: { y: -1,   l: "Fumador ocasional / social" },
      former:     { y: -1.5, l: "Lo dejaste — recuperando años" },
      vape:       { y: -3,   l: "Vapeo — menos dañino pero no inocuo" },
      yes:        { y: -8,   l: "Fumar resta años de vida" }
    };
    if (smk[safe.smoke]) factors.push({ key: "smoke", ...smk[safe.smoke], cat: "Tabaco", group: "habits" });

    // --- Alcohol (Lancet 2018, NEJM, GBD Study 2022) ---
    // Evidencia actual: el "umbral seguro" se ha desmontado. Incluso el patrón mediterráneo
    // tiene leve coste neto. El binge weekend es peor que el diario moderado.
    const alc = {
      none:          { y: 0.5, l: "Sin alcohol" },
      occasional:    { y: 0,   l: "Ocasional — alguna copa al mes" },
      mediterranean: { y: -0.5,l: "Una copa diaria con la comida" },
      weekend:       { y: -2,  l: "Atracón los fines de semana" },
      frequent:      { y: -3,  l: "Frecuente — varios días a la semana" },
      heavy:         { y: -6,  l: "Diario y abundante" },
      // back-compat con datos antiguos
      moderate:      { y: -0.5, l: "Consumo moderado" }
    };
    if (alc[safe.alcohol]) factors.push({ key: "alcohol", ...alc[safe.alcohol], cat: "Alcohol", group: "habits" });

    // --- Movimiento (CDC, Lee et al. JAMA 2022, Atia/San Millán Z2) ---
    const ex = {
      sedentary: { y: -4,  l: "Sedentarismo" },
      none:      { y: -4,  l: "Sedentarismo" }, // back-compat
      light:     { y: 1,   l: "Algo de actividad" },
      natural:   { y: 2.5, l: "Vida activa natural" },
      moderate:  { y: 4,   l: "Actividad regular" },
      active:    { y: 5,   l: "Muy activo/a" },
      intense:   { y: 5,   l: "Muy activo/a" }, // back-compat
      athlete:   { y: 5.5, l: "Atleta — fuerza y cardio" }
    };
    if (ex[safe.exercise]) factors.push({ key: "exercise", ...ex[safe.exercise], cat: "Movimiento", group: "activity" });

    // --- Alimentación (PREDIMED, Adventist Health, EPIC, Blue Zones) ---
    const dt = {
      mediterranean: { y: 5,   l: "Dieta mediterránea" },
      excellent:     { y: 5,   l: "Dieta tipo Blue Zone" }, // back-compat
      plantbased:    { y: 4,   l: "Plant-based equilibrada" },
      pescetarian:   { y: 4.5, l: "Pescetariana" },
      balanced:      { y: 2,   l: "Equilibrada — cocino casero" },
      good:          { y: 2,   l: "Buena alimentación" }, // back-compat
      mixed:         { y: 0,   l: "Mixta sin pensar mucho" },
      average:       { y: 0,   l: "Alimentación promedio" }, // back-compat
      lowcarb:       { y: -0.5,l: "Baja en carbohidratos" },
      processed:     { y: -3,  l: "Dieta procesada" },
      poor:          { y: -3,  l: "Dieta procesada" } // back-compat
    };
    if (dt[safe.diet]) factors.push({ key: "diet", ...dt[safe.diet], cat: "Alimentación", group: "diet" });

    // --- Sueño (Walker, Stanford Sleep) ---
    const sl = {
      lt6: { y: -3, l: "Dormir poco envejece" },
      s67: { y: -1, l: "Algo escaso" },
      s79: { y:  2, l: "Sueño óptimo" },
      gt9: { y: -1, l: "Demasiado sueño" }
    };
    if (sl[safe.sleep]) factors.push({ key: "sleep", ...sl[safe.sleep], cat: "Descanso", group: "rest" });

    // --- Estrés (Harvard, Lancet stress meta-analysis 2018) ---
    // 'managed' es clave: estrés con herramientas (meditación, deporte) atenúa mucho su daño
    const st = {
      calm:        { y:  2, l: "Calma diaria" },
      low:         { y:  2, l: "Calma diaria" }, // back-compat
      managed:     { y:  1, l: "Estrés a ratos pero gestionado" },
      moderate:    { y: -1, l: "Estrés a ratos" }, // back-compat
      fluctuating: { y: -1, l: "Picos y valles sin gestión" },
      high:        { y: -3, l: "Estrés crónico" },
      burned:      { y: -5, l: "Agotamiento sostenido" }
    };
    if (st[safe.stress]) factors.push({ key: "stress", ...st[safe.stress], cat: "Mente", group: "rest" });

    // --- Vínculos (Holt-Lunstad 2010, Harvard SAD 85 años) ---
    const so = {
      strong:      { y:  4,   l: "Tribu fuerte" },
      close_few:   { y:  3,   l: "Pocos vínculos pero profundos" },
      family_only: { y:  1.5, l: "Buena familia, pocos amigos" },
      average:     { y:  0,   l: "Vínculos suficientes" },
      isolated:    { y: -5,   l: "Pocos vínculos" }
    };
    if (so[safe.social]) factors.push({ key: "social", ...so[safe.social], cat: "Vínculos", group: "social" });

    // --- Estado civil ---
    const civ = {
      single:   { y:  0, l: "Soltero/a" },
      married:  { y:  3, l: "En pareja — protección emocional" },
      cohabit:  { y:  2, l: "Conviviendo" },
      divorced: { y: -1, l: "Divorciado/a" },
      widowed:  { y: -2, l: "Viudo/a" }
    };
    if (civ[safe.civil]) factors.push({ key: "civil", ...civ[safe.civil], cat: "Estado civil", group: "social" });

    // --- Propósito (Sone et al. 2008 Okinawa, Cohen et al. 2016) ---
    const pp = {
      clear:     { y:  6, l: "Ikigai claro" },
      yes:       { y:  6, l: "Ikigai claro" }, // back-compat
      partial:   { y:  3, l: "Tengo varios, no uno claro" },
      sometimes: { y:  2, l: "A medias" }, // back-compat
      searching: { y:  0, l: "Estoy buscando" },
      no:        { y: -3, l: "Buscando propósito" }, // back-compat
      lost:      { y: -3, l: "Lo he perdido" }
    };
    if (pp[safe.purpose]) factors.push({ key: "purpose", ...pp[safe.purpose], cat: "Propósito", group: "social" });

    // --- Genética: longevidad familiar (~25% del total según estudios de gemelos) ---
    const fam = { many: { y: 3, l: "Familia muy longeva" },
                  some: { y: 1, l: "Algunos familiares longevos" },
                  avg:  { y: 0, l: "Promedio familiar" },
                  early:{ y: -3, l: "Antecedentes de muerte temprana" },
                  unknown: { y: 0, l: "Sin datos familiares" } };
    if (fam[safe.familyLongevity]) factors.push({ key: "family", ...fam[safe.familyLongevity], cat: "Genética", group: "genetics" });

    // --- Condiciones crónicas (multi) ---
    if (safe.conditions.length > 0) {
      const condY = { diabetes: -7, hypertension: -3, heart: -5, cholesterol: -2, cancer: -4, depression: -3 };
      const condL = { diabetes: "Diabetes", hypertension: "Hipertensión", heart: "Enfermedad cardíaca", cholesterol: "Colesterol alto", cancer: "Cáncer (historial)", depression: "Depresión clínica" };
      safe.conditions.forEach(c => {
        if (condY[c] !== undefined) {
          factors.push({ key: `cond_${c}`, y: condY[c], l: condL[c], cat: condL[c], group: "medical" });
        }
      });
    }

    // --- Tensión arterial (opcional) ---
    if (safe.bloodPressure) {
      const bpY = { normal: 1, elevated: -1, high: -3 };
      const bpL = { normal: "Tensión normal", elevated: "Tensión elevada", high: "Hipertensión arterial" };
      if (bpY[safe.bloodPressure] !== undefined) {
        factors.push({ key: "bp", y: bpY[safe.bloodPressure], l: bpL[safe.bloodPressure], cat: "Tensión", group: "medical" });
      }
    }

    // --- Frecuencia cardíaca en reposo (opcional) ---
    if (safe.restingHR > 0) {
      let hrY, hrL;
      if (safe.restingHR < 60)      { hrY = 1; hrL = `${safe.restingHR} ppm — corazón eficiente`; }
      else if (safe.restingHR < 70) { hrY = 0.5; hrL = `${safe.restingHR} ppm — saludable`; }
      else if (safe.restingHR < 80) { hrY = 0; hrL = `${safe.restingHR} ppm — promedio`; }
      else if (safe.restingHR < 90) { hrY = -1; hrL = `${safe.restingHR} ppm — algo elevada`; }
      else                          { hrY = -2; hrL = `${safe.restingHR} ppm — elevada`; }
      factors.push({ key: "hr", y: hrY, l: hrL, cat: "Pulso reposo", group: "medical" });
    }

    const adjustment = factors.reduce((s, f) => s + (Number.isFinite(f.y) ? f.y : 0), 0);
    let expectancy = Math.max(safe.age + 2, Math.min(108, base + adjustment));
    if (!Number.isFinite(expectancy)) expectancy = base;
    const remaining = Math.max(0, expectancy - safe.age);
    const potential = Math.max(0, factors.filter(f => f.y < 0).reduce((s, f) => s + Math.abs(f.y), 0));

    // Group breakdown — labels via translation keys (resolved en el render)
    const groups = {
      habits:   { labelKey: "groups.habits",   years: 0 },
      social:   { labelKey: "groups.social",   years: 0 },
      diet:     { labelKey: "groups.diet",     years: 0 },
      activity: { labelKey: "groups.activity", years: 0 },
      rest:     { labelKey: "groups.rest",     years: 0 },
      genetics: { labelKey: "groups.genetics", years: 0 },
      medical:  { labelKey: "groups.medical",  years: 0 },
    };
    factors.forEach(f => { if (groups[f.group]) groups[f.group].years += f.y; });

    // Solo grupos con datos
    const activeGroups = {};
    Object.entries(groups).forEach(([k, g]) => { if (factors.some(f => f.group === k)) activeGroups[k] = g; });

    return {
      base, bmi: Math.round(bmi * 10) / 10,
      expectancy: Math.round(expectancy * 10) / 10,
      remaining: Math.round(remaining * 10) / 10,
      factors, potential: Math.round(potential),
      adjustment: Math.round(adjustment * 10) / 10,
      groups: activeGroups,
      countryName: country.name,
    };
  } catch (e) {
    console.error("[EONIX] calculateLifespan recovered from error:", e);
    // Resultado mínimo válido — la app NO se queda colgada
    const country = COUNTRY_BASE[safe.country] || COUNTRY_BASE.OTHER;
    const base = safe.gender === "F" ? country.F : country.M;
    return {
      base,
      bmi: 22,
      expectancy: base,
      remaining: Math.max(0, base - safe.age),
      factors: [],
      potential: 0,
      adjustment: 0,
      groups: {},
      countryName: country.name,
    };
  }
};

const Btn = ({ children, onClick, variant = "primary", disabled, full, icon }) => {
  const variantStyles = variant === "primary"
    ? { background: C.olive, color: C.paper, border: "none" }
    : variant === "terra"
    ? { background: C.terra, color: C.paper, border: "none" }
    : variant === "outline"
    ? { background: "transparent", color: C.olive, border: `1.5px solid ${C.olive}` }
    : variant === "ghost"
    ? { background: "transparent", color: C.ink, border: "none" }
    : variant === "soft"
    ? { background: C.paper, color: C.ink, border: `1px solid ${C.line}` }
    : { background: C.olive, color: C.paper, border: "none" };
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      className="tap-soft"
      style={{
        ...variantStyles,
        width: full ? "100%" : "auto",
        padding: "16px 24px",
        borderRadius: 999,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        gap: 8,
        fontWeight: 500,
        letterSpacing: "0.01em",
        fontSize: 16,
        fontFamily: "Roboto, system-ui, sans-serif",
        cursor: disabled ? "not-allowed" : "pointer",
        opacity: disabled ? 0.4 : 1,
        transition: "all 0.2s",
      }}
    >
      <span>{children}</span>
      {icon && <span style={{ display: "inline-flex" }}>{icon}</span>}
    </button>
  );
};

const IntroSlides = ({ onComplete }) => {
  const [idx, setIdx] = useState(0);
  const slide = INTRO_SLIDES[idx];
  const isLast = idx === INTRO_SLIDES.length - 1;
  const tx = useT();

  const next = () => {
    if (isLast) onComplete();
    else setIdx(i => i + 1);
  };

  return (
    <div className="screen" style={{ background: BUBBLE_BG }}>

/* ============================================================
   HELPERS PSICOLÓGICOS
   - Saludo personalizado por hora (refuerza vínculo)
   - Insight diario rotativo (motivo para volver cada día)
   - Toast de celebración (refuerzo positivo inmediato)
   ============================================================ */

// Saludo según hora del día — usa traducciones del idioma activo
const getGreeting = (name, lang = "es") => {
  const h = new Date().getHours();
  const n = (name || "").trim().split(" ")[0];  // solo el nombre de pila
  const key = h < 6 ? "greet.evening"
            : h < 13 ? "greet.morning"
            : h < 20 ? "greet.afternoon"
            : "greet.evening";
  const greet = t(key, lang);
  return n ? `${greet}, ${n}` : greet;
};

// Insight diario — rotativo, basado en día del año (estable durante el día,
// cambia mañana). Mezcla biohacks con sabiduría de Zonas Azules.
// Cada entrada referencia claves de traducción (ins.tag.* / ins.text.*) en
// vez de strings hardcodeados, para que cambie con el idioma de la app.
const DAILY_INSIGHTS = [
  { tagKey: "ins.tag.today",       textKey: "ins.text.morningLight" },
  { tagKey: "ins.tag.didYouKnow",  textKey: "ins.text.naturalMove" },
  { tagKey: "ins.tag.ikigai",      textKey: "ins.text.purposeYears" },
  { tagKey: "ins.tag.today",       textKey: "ins.text.postmealWalk" },
  { tagKey: "ins.tag.didYouKnow",  textKey: "ins.text.harvardRel" },
  { tagKey: "ins.tag.mind",        textKey: "ins.text.physSigh" },
  { tagKey: "ins.tag.med",         textKey: "ins.text.oliveOil" },
  { tagKey: "ins.tag.ikigai",      textKey: "ins.text.okiRetire" },
  { tagKey: "ins.tag.today",       textKey: "ins.text.laughCortisol" },
  { tagKey: "ins.tag.didYouKnow",  textKey: "ins.text.lonelyHeart" },
  { tagKey: "ins.tag.body",        textKey: "ins.text.muscle30" },
  { tagKey: "ins.tag.mind",        textKey: "ins.text.med10" },
  { tagKey: "ins.tag.today",       textKey: "ins.text.sleepCold" },
  { tagKey: "ins.tag.community",   textKey: "ins.text.sardFamily" },
];
const getDailyInsight = () => {
  const start = new Date(new Date().getFullYear(), 0, 0);
  const now = new Date();
  const diff = now - start + ((start.getTimezoneOffset() - now.getTimezoneOffset()) * 60 * 1000);
  const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
  return DAILY_INSIGHTS[dayOfYear % DAILY_INSIGHTS.length];
};

/* ============================================================
   MODO IMPACTO — métricas y componentes para el Inicio dramático
   Genera shock positivo controlado: número grande, potencial, "lo que ganas"
   ============================================================ */

const computeImpact = (data) => {
  if (!data || !data.factors) return { yearsToGain: 5, energyBoost: 25, riskReduction: 30, potentialPct: 75 };

  const negFactors = data.factors.filter(f => f.y < 0);
  const negSum = Math.abs(negFactors.reduce((s, f) => s + f.y, 0));

  // Años recuperables = factores negativos + buffer optimista
  const yearsToGain = Math.max(5, Math.min(15, Math.round(negSum + 3)));

  // % energía: depende de hábitos clave (ejercicio, sueño, estrés, dieta)
  const lowEnergyFactors = data.factors.filter(f =>
    ["exercise", "sleep", "stress", "diet"].includes(f.key) && f.y < 0
  ).length;
  const energyBoost = Math.round(15 + lowEnergyFactors * 6);

  // % riesgo enfermedad reducible
  const riskFactors = data.factors.filter(f =>
    ["smoke", "alcohol", "diet", "exercise"].includes(f.key) && f.y < 0
  ).length;
  const riskReduction = Math.round(20 + riskFactors * 6);

  // Score de potencial actual (0-95%)
  const potentialPct = Math.round(Math.min(95, Math.max(40, (data.expectancy / 95) * 100)));

  return { yearsToGain, energyBoost, riskReduction, potentialPct };
};

/* ============================================================
   DAILY REMINDER BANNER (Home tab only)
   ------------------------------------------------------------
   Aparece flotando arriba de la barra inferior si:
   - Hay al menos 1 reto activo
   - El usuario no ha marcado todos sus retos activos hoy
   - Es a partir de mediodía (antes no agobiamos)
   - El usuario no lo ha cerrado ya hoy
   El tono se ajusta por hora: midday (12-18h) → soft; evening
   (18-22h) → encouraging; night (22h+) → last call.
   ============================================================ */
const REMINDER_DISMISS_KEY = "eonix.reminder.dismissed";

const getReminderState = (todayDone, activeKeys) => {
  if (!activeKeys || activeKeys.length === 0) return null;
  // Cuántos de los retos activos están marcados HOY
  const markedToday = activeKeys.filter(k => todayDone.includes(k)).length;
  const total = activeKeys.length;
  const remaining = total - markedToday;
  if (remaining <= 0) return null; // todos marcados → no recordamos

  const hour = new Date().getHours();
  // Antes de mediodía no aparece (es muy pronto, da agobio)
  if (hour < 12) return null;

  let urgency;
  if (hour < 18)       urgency = "midday";
  else if (hour < 22)  urgency = "evening";
  else                 urgency = "night";

  // Por la noche (>=22h) sólo aparece si NO hay nada marcado y hay >1 retos.
  // Si ya marcó algunos, no insistimos al final del día.
  if (urgency === "night" && markedToday > 0) return null;

  return { urgency, marked: markedToday, total, remaining };
};

const DailyReminderBanner = ({ todayDone, questState, onGoHabits }) => {
  const tx = useT();
  const [dismissed, setDismissed] = useState(() => {
    try {
      const stored = localStorage.getItem(REMINDER_DISMISS_KEY);
      // El dismiss se guarda como YYYY-MM-DD; vale solo para hoy
      return stored === tracker.todayKey();
    } catch (e) { return false; }
  });

  const activeKeys = Object.keys(questState.active || {});
  const state = getReminderState(todayDone, activeKeys);

  if (dismissed || !state) return null;

  // Selecciona el copy según urgencia y cuántos quedan
  const titleKey =
    state.urgency === "midday"  ? "rem.title.midday"  :
    state.urgency === "evening" ? "rem.title.evening" :
                                  "rem.title.night";

  let bodyKey, bodyN;
  if (state.marked === 0) {
    if (state.total === 1) bodyKey = "rem.body.noneOne";
    else                   { bodyKey = "rem.body.noneMany"; bodyN = state.total; }
  } else {
    if (state.remaining === 1) bodyKey = "rem.body.partOne";
    else                       { bodyKey = "rem.body.partMany"; bodyN = state.remaining; }

const DonutChart = ({ value, max = 100, large = false }) => {
  const radius = 78;
  const strokeWidth = large ? 11 : 14;
  const circ = 2 * Math.PI * radius;
  const pct = Math.min(1, value / max);
  return (
    <div style={{ position: "relative", width: "100%", height: "100%" }}>
      <svg viewBox="0 0 200 200" style={{ width: "100%", height: "100%", display: "block" }} aria-hidden>
        {/* Track */}
        <circle cx="100" cy="100" r={radius} fill="none" stroke={C.oliveBg} strokeWidth={strokeWidth} />
        {/* Progress */}
        <circle cx="100" cy="100" r={radius} fill="none" stroke={C.olive} strokeWidth={strokeWidth}
          strokeLinecap="round"
          strokeDasharray={circ}
          strokeDashoffset={circ * (1 - pct)}
          transform="rotate(-90 100 100)"
          style={{ transition: "stroke-dashoffset 1.4s cubic-bezier(0.2, 0.7, 0.2, 1)" }} />
      </svg>
      {/* Center label — HTML overlay for proper typography control */}
      <div style={{
        position: "absolute", top: 0, left: 0, right: 0, bottom: 0,
        display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center",
        pointerEvents: "none",
      }}>
        <div className="f-display" style={{
          fontSize: large ? 64 : 48,
          fontWeight: 500,
          color: C.olive,
          lineHeight: 1,
          letterSpacing: "-0.02em",
        }}>
          {Math.round(value)}
        </div>
        <div className="f-body" style={{
          fontSize: large ? 13 : 12,
          color: C.inkSoft,
          fontWeight: 500,
          marginTop: 4,
          letterSpacing: "0.05em",
        }}>
          años
        </div>
      </div>
    </div>
  );
};

// URL pública de la app — cambiar este valor cuando se despliegue
// Si se deja vacío "", usa window.location.href automáticamente
const APP_URL = "";

// Texto que acompaña al enlace cuando se comparte
const SHARE_MESSAGE = "He descubierto EONIX, una app de biohacking basada en evidencia que te dice cómo vivir mejor y por más tiempo. Deberías probarla.";

const getShareUrl = () => {
  if (APP_URL && APP_URL.trim()) return APP_URL.trim();
  if (typeof window !== "undefined") return window.location.href;
  return "";
};

// Texto personalizado con nombre y resultado para WhatsApp
const buildPersonalShareMessage = ({ name, expectancy }) => {
  const url = getShareUrl();
  const intro = name
    ? `¡Hola! Soy ${name} y acabo de descubrir EONIX.`
    : `¡Hola! Acabo de descubrir EONIX.`;
  const result = expectancy
    ? ` Mi esperanza de vida estimada es de ${Math.round(expectancy)} años.`
    : "";
  return `${intro}${result} Es una app de biohacking basada en evidencia que te dice cómo vivir mejor y por más tiempo.\n\nHaz tu test gratis: ${url}`;
};

const shareApp = async (custom) => {
  const url = getShareUrl();
  const text = custom || SHARE_MESSAGE;
  const data = { title: "EONIX · Biohacking", text, url };

  if (typeof navigator !== "undefined" && navigator.share) {
    try {
      await navigator.share(data);
      return { success: true, method: "native" };
    } catch (err) {
      if (err && err.name === "AbortError") return { success: false, cancelled: true };
    }
  }

  // Fallback: copy to clipboard
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(`${text} ${url}`);
      return { success: true, method: "clipboard" };
    }
  } catch (e) { /* ignore */ }
  return { success: false, method: "none" };
};

const openShareUrl = (provider, customText) => {
  const url = getShareUrl();
  const baseText = customText || SHARE_MESSAGE;
  const text = customText ? customText : `${baseText} ${url}`;
  const links = {
    whatsapp: `https://wa.me/?text=${encodeURIComponent(text)}`,
    twitter:  `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`,
    telegram: `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(baseText)}`,
    email:    `mailto:?subject=${encodeURIComponent("EONIX — vive mejor, por más tiempo")}&body=${encodeURIComponent(text)}`,
  };
  if (links[provider]) window.open(links[provider], "_blank");
};

// Botón grande dedicado de WhatsApp — al final del resultado

/* ============================================================
   TRACKER DE HÁBITOS — persistencia diaria
   Cache en módulo: localStorage.getItem cuesta 0.5-2ms y se
   llamaba en cada render. Cacheamos y invalidamos en saveAll/toggle.
   ============================================================ */
const TRACKER_KEY = "eonix.tracker.v1";
let _trackerCache = null;

const tracker = {
  loadAll() {
    if (_trackerCache !== null) return _trackerCache;
    try {
      const raw = localStorage.getItem(TRACKER_KEY);
      if (!raw) return (_trackerCache = { history: {}, streak: 0, lastDate: null });
      const data = JSON.parse(raw);
      _trackerCache = { history: data.history || {}, streak: data.streak || 0, lastDate: data.lastDate || null };
      return _trackerCache;
    } catch (e) {
      return (_trackerCache = { history: {}, streak: 0, lastDate: null });
    }
  },
  saveAll(payload) {
    // Cache invalidation: SIEMPRE creamos NUEVAS referencias en todos los niveles
    // para que React detecte el cambio via Object.is. Sin esto, los toggle del día
    // no re-renderizaban hasta refrescar la página manualmente.
    const newHistory = {};
    for (const k in (payload.history || {})) {
      newHistory[k] = [...(payload.history[k] || [])];
    }
    _trackerCache = {
      history: newHistory,
      streak: payload.streak || 0,
      lastDate: payload.lastDate || null
    };
    try { localStorage.setItem(TRACKER_KEY, JSON.stringify(_trackerCache)); } catch (e) {}
  },
  todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  },
  yesterdayKey() {
    const d = new Date(); d.setDate(d.getDate() - 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  },
  toggle(habitKey) {
    const all = this.loadAll();
    const today = this.todayKey();
    const todayList = all.history[today] || [];
    const isMarked = todayList.includes(habitKey);
    const newList = isMarked ? todayList.filter(k => k !== habitKey) : [...todayList, habitKey];
    all.history[today] = newList;
    // El streak ahora se DERIVA del historial (computeStreakFromHistory en
    // useTracker), así que aquí ya no hace falta mantenerlo. Mantenemos
    // lastDate solo por compatibilidad con datos antiguos en localStorage.
    if (newList.length > 0) all.lastDate = today;
    this.saveAll(all);
    return all;
  },
  toggleDay(habitKey, dateKey) {
    // Marca/desmarca un hábito en un día específico (presente o pasado).
    // El streak se calcula a partir del historial (ver useTracker), por lo que
    // marcar días pasados retroactivamente sí ajusta correctamente el contador.
    const all = this.loadAll();
    const list = all.history[dateKey] || [];
    const isMarked = list.includes(habitKey);
    const newList = isMarked ? list.filter(k => k !== habitKey) : [...list, habitKey];
    all.history[dateKey] = newList;
    if (dateKey === this.todayKey() && newList.length > 0) all.lastDate = dateKey;
    this.saveAll(all);
    return all;
  },
  getDay(dateKey) {
    return this.loadAll().history[dateKey] || [];
  },
  getToday() {
    const all = this.loadAll();
    return all.history[this.todayKey()] || [];
  },
};

/* Hook que escucha cambios al tracker.
   El streak se DERIVA del historial (no se almacena), así marcar días
   pasados retroactivamente actualiza el contador correctamente. */
const computeStreakFromHistory = (history) => {
  if (!history) return 0;
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  let streak = 0;
  // Caminamos hacia atrás día a día. Si HOY no está marcado, el streak puede
  // empezar en AYER (forgiveness — el usuario aún no ha marcado hoy).
  const todayKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const todayHas = Array.isArray(history[todayKey]) && history[todayKey].length > 0;
  if (!todayHas) {
    // Empezar a contar desde ayer
    d.setDate(d.getDate() - 1);
  }
  // Limitar el bucle a 365 iteraciones por seguridad
  for (let i = 0; i < 365; i++) {
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const list = history[key];
    if (Array.isArray(list) && list.length > 0) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
};

const useTracker = () => {
  const [state, setState] = useState(() => tracker.loadAll());
  const refresh = React.useCallback(() => setState(tracker.loadAll()), []);
  const toggleHabit = React.useCallback((key) => {
    tracker.toggle(key);
    refresh();
  }, [refresh]);
  const toggleHabitDay = React.useCallback((key, dateKey) => {
    tracker.toggleDay(key, dateKey);
    refresh();
  }, [refresh]);
  const today = state.history[tracker.todayKey()] || [];
  const streak = computeStreakFromHistory(state.history || {});
  return { today, streak, toggle: toggleHabit, toggleDay: toggleHabitDay, history: state.history || {}, refresh };
};

/* Devuelve los 7 días de la semana actual (lunes-domingo) con metadata */
const getCurrentWeek = () => {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const dayOfWeek = today.getDay(); // 0=Domingo, 1=Lunes, ..., 6=Sábado
  // Calcular el lunes de esta semana
  const daysFromMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
  const monday = new Date(today);
  monday.setDate(today.getDate() - daysFromMonday);

  const labels = ["L", "M", "X", "J", "V", "S", "D"];
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const dateKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    return {
      date: d,
      dateKey,
      label: labels[i],
      isToday: d.getTime() === today.getTime(),
      isFuture: d.getTime() > today.getTime(),
      isPast: d.getTime() < today.getTime(),
    };
  });
};

/* Selecciona los 3 hábitos prioritarios para el usuario según sus debilidades */
const getPriorityHabits = (data) => {
  if (!data || !data.factors) return BIOHACK_PILLARS.slice(0, 3);
  const negativeKeys = data.factors.filter(f => f.y < 0).map(f => f.key);
  // Prioriza biohacks que atacan factores negativos
  const scored = BIOHACK_PILLARS.map(b => ({
    ...b,
    score: b.target.filter(t => negativeKeys.includes(t)).length,
  }));
  scored.sort((a, b) => {
    if (b.score !== a.score) return b.score - a.score;
    const aPot = (BIOHACK_PROTOCOLS[a.key] || {}).yearsPotential || 0;
    const bPot = (BIOHACK_PROTOCOLS[b.key] || {}).yearsPotential || 0;
    return bPot - aPot;
  });
  return scored.slice(0, 3);
};

const QUESTS_KEY = "eonix.quests.v1";
let _questsCache = null;

const quests = {
  load() {
    if (_questsCache !== null) return _questsCache;
    try {
      const raw = localStorage.getItem(QUESTS_KEY);
      if (!raw) return (_questsCache = { active: {}, completed: [] });
      const data = JSON.parse(raw);
      _questsCache = { active: data.active || {}, completed: data.completed || [] };
      return _questsCache;
    } catch (e) {
      return (_questsCache = { active: {}, completed: [] });
    }
  },
  save(state) {
    // Igual que tracker: nueva referencia en cada nivel para que React detecte cambios
    _questsCache = {
      active: { ...(state.active || {}) },
      completed: [...(state.completed || [])]
    };
    try { localStorage.setItem(QUESTS_KEY, JSON.stringify(_questsCache)); } catch (e) {}
  },
  activate(key) {
    const state = this.load();
    if (state.active[key]) return state;
    // Bug fix: startedAt = lunes de la semana actual (no "hoy"). Así las marcas
    // que ya muestra la vista semanal (L M X…) cuentan en RETO TOTAL desde el
    // primer momento. Marcas de semanas anteriores NO cuentan, así que retos
    // nuevos no se auto-completan con datos antiguos.
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    const dow = d.getDay(); // 0=Dom, 1=Lun…
    const daysFromMonday = dow === 0 ? 6 : dow - 1;
    d.setDate(d.getDate() - daysFromMonday);
    const startedAt = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    state.active[key] = { startedAt, target: (QUEST_TEMPLATES[key] || {}).target || 21 };
    // Si el reto estaba en `completed` (caso "Repetir"), lo sacamos de allí
    // para que no aparezca a la vez en "En curso" y en "Logros".
    if (Array.isArray(state.completed) && state.completed.length > 0) {
      state.completed = state.completed.filter(c => c.key !== key);
    }
    this.save(state);
    return state;
  },
  abandon(key) {
    const state = this.load();
    delete state.active[key];
    this.save(state);
    return state;
  },
  complete(key) {
    const state = this.load();
    delete state.active[key];
    state.completed = state.completed || [];
    if (!state.completed.find(c => c.key === key)) {
      state.completed.push({ key, completedAt: tracker.todayKey() });
    }
    this.save(state);
    return state;
  },
  isActive(key) { return !!this.load().active[key]; },
  isCompleted(key) { return (this.load().completed || []).some(c => c.key === key); },
};

/* Helper: clave ISO del lunes de la semana actual (zona local) */
const mondayOfThisWeekKey = () => {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  const dow = d.getDay();
  const daysFromMonday = dow === 0 ? 6 : dow - 1;
  d.setDate(d.getDate() - daysFromMonday);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};

/* Calcula el progreso de un reto: días marcados desde startedAt
   o desde el lunes de la semana actual, lo que sea más antiguo.
   Esto asegura que las marcas ya visibles en la vista semanal cuenten en
   RETO TOTAL incluso para retos creados con la lógica anterior (startedAt=hoy). */
const getQuestProgress = (key, questState, trackerHistory) => {
  const q = questState.active[key];
  if (!q) return null;
  // Tomamos el mínimo entre startedAt guardado y el lunes de esta semana, para
  // que las marcas que ve el usuario en "ESTA SEMANA" siempre cuenten.
  const monday = mondayOfThisWeekKey();
  const effectiveStart = q.startedAt && q.startedAt < monday ? q.startedAt : monday;
  let days = 0;
  for (const [date, list] of Object.entries(trackerHistory || {})) {
    if (date >= effectiveStart && Array.isArray(list) && list.includes(key)) {
      days++;
    }
  }
  const target = q.target || 21;
  const pct = Math.min(100, Math.round((days / target) * 100));
  return { current: days, target, pct, completed: days >= target };
};

/* Hook que combina quests + tracker */
const useQuests = () => {
  const [state, setState] = useState(() => quests.load());
  const refresh = React.useCallback(() => setState(quests.load()), []);
  const activate = React.useCallback((key) => { quests.activate(key); refresh(); }, [refresh]);
  const abandon  = React.useCallback((key) => { quests.abandon(key);  refresh(); }, [refresh]);
  const complete = React.useCallback((key) => { quests.complete(key); refresh(); }, [refresh]);

  // Auto-completar retos que llegaron al objetivo.
  // Antes dependía solo de tracker.lastDate (que solo cambia al marcar HOY),
  // así que marcar días pasados no disparaba el auto-completado. Ahora
  // dependemos de un hash del historial (cuenta total de marcas) para reaccionar
  // a cualquier cambio.
  const trackerState = tracker.loadAll();
  const activeKeys = Object.keys(state.active || {});
  const historyHash = React.useMemo(() => {
    let total = 0;
    for (const list of Object.values(trackerState.history || {})) {
      if (Array.isArray(list)) total += list.length;
    }
    return total;
  }, [trackerState.history]);
  React.useEffect(() => {
    activeKeys.forEach(k => {
      const p = getQuestProgress(k, state, trackerState.history);
      if (p && p.completed) {
        quests.complete(k);
        refresh();
      }
    });
  }, [activeKeys.join(","), historyHash]);

  return { active: state.active, completed: state.completed || [], activate, abandon, complete, refresh };
};

const BiohacksTab = React.memo(({ data, onShare }) => {
  const [open, setOpen] = useState(null);

  const [previewKey, setPreviewKey] = useState(null); // reto en preview modal
  const [confirmAbandon, setConfirmAbandon] = useState(null); // reto a abandonar (key)
  const [toast, setToast] = useState(null); // {message, icon} para feedback positivo
  const { today: todayDone, streak, toggle: toggleHabit, toggleDay, history: trackerFullHistory } = useTracker();
  const questHook = useQuests();
  const trackerHistory = tracker.loadAll().history;
  const tx = useT();

  // Wrapper de toggleDay con feedback positivo (refuerzo dopaminérgico)
  const handleToggleDay = (habitKey, dateKey) => {
    const wasMarked = (trackerFullHistory[dateKey] || []).includes(habitKey);
    toggleDay(habitKey, dateKey);
    if (!wasMarked) {
      // Solo celebramos cuando MARCAS, no cuando desmarcas
      const biohack = BIOHACK_PILLARS.find(b => b.key === habitKey);
      const today = new Date().toISOString().slice(0, 10);
      const isToday = dateKey === today;
      // Mensaje variado según contexto: streak alta, primera vez del día, etc.
      let msg = tx("habits.toast.marked");
      if (isToday) {
        const newCount = (trackerFullHistory[today] || []).length + 1;
        if (streak + 1 >= 7 && newCount === 1) msg = tx("habits.toast.streak").replace("{n}", streak + 1);
        else if (newCount === 1) msg = tx("habits.toast.firstToday");
        else if (newCount >= 3) msg = tx("habits.toast.unstoppable").replace("{n}", newCount);
        else msg = tx("habits.toast.adding");
      } else {
        msg = tx("habits.toast.dayMarked");
      }
      setToast({ message: msg, biohack: biohack?.title });
    }
  };

  const handleAcceptQuest = (key) => {
    questHook.activate(key);
    setPreviewKey(null);
    setTab("active");
    const biohack = BIOHACK_PILLARS.find(b => b.key === key);
    setToast({ message: tx("habits.toast.activated").replace("{title}", biohack?.title || "") });
  };

  const handleConfirmAbandon = () => {
    if (confirmAbandon) {
      questHook.abandon(confirmAbandon);
      setConfirmAbandon(null);
    }
  };

  const negativeKeys = data.factors.filter(f => f.y < 0).map(f => f.key);
  const activeKeys = Object.keys(questHook.active || {});
  const completedKeys = (questHook.completed || []).map(c => c.key);

  <select value={value || ""} onChange={(e) => onChange(e.target.value)}

    style={{ background: C.paper, border: `1px solid ${C.line}`, color: C.ink, backgroundImage: `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235A5048' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>")`, backgroundRepeat: "no-repeat", backgroundPosition: "right 12px center", paddingRight: "40px" }}>
    <option value="" disabled>Selecciona…</option>
    {options.map(o => <option key={o.k} value={o.k}>{o.l}</option>)}
  </select>
);

const FieldChips = ({ value = [], onChange, options }) => {
  const toggle = (k) => {
    if (value.includes(k)) onChange(value.filter(v => v !== k));
    else onChange([...value, k]);
  };
  return (
    <div className="flex flex-wrap gap-2">
      {options.map(o => {
        const active = value.includes(o.k);
        return (
          <button key={o.k} onClick={() => toggle(o.k)}
            className="px-3 py-2 rounded-full text-sm tap-soft transition-all"
            style={{
              background: active ? C.olive : "rgba(250,246,236,0.95)",
              color: active ? C.paper : C.ink,
              border: `1px solid ${active ? C.olive : C.line}`,
              fontWeight: active ? 500 : 400,
            }}>
            {o.l}
          </button>
        );
      })}
    </div>
  );
};

/* ============================================================
   PERSISTENCIA — guardar datos del usuario en su dispositivo
   localStorage solo: nada sale del navegador del usuario
   ============================================================ */

const STORAGE_KEY = "eonix.user.v1";
const DEFAULT_DATA = {
  name: "",
  age: 30, gender: "",
  height: 170, weight: 70,
  country: "ES",
  civil: "", diet: "", exercise: "", alcohol: "",
  sleepHours: 7, sleep: "s79",
  stress: "", social: "", purpose: "",
  familyLongevity: "",
  conditions: [],
  bloodPressure: "",
  restingHR: 0,
  smoke: "",
};

// Helpers seguros — nunca rompen la app si localStorage no está disponible
const storage = {
  load() {
    try {
      if (typeof localStorage === "undefined") return null;
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      // Validación mínima: que tenga al menos nombre y género (datos básicos completados)
      if (!parsed || typeof parsed !== "object") return null;
      if (!parsed.data || !parsed.data.name || !parsed.data.gender) return null;
      return parsed;
    } catch (e) {
      console.warn("EONIX: error leyendo storage", e);
      return null;
    }
  },
  save(payload) {
    try {
      if (typeof localStorage === "undefined") return false;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      return true;
    } catch (e) {
      console.warn("EONIX: error guardando storage", e);
      return false;
    }
  },
  clear() {
    try {
      if (typeof localStorage === "undefined") return;
      // Borra TODOS los datos del usuario: perfil, hábitos diarios, retos activos.
      // Conserva intencionalmente la preferencia de idioma (LANG_KEY) — es una preferencia
      // de UI, no un dato personal: si el usuario eligió alemán, al volver a usar la app
      // se mantiene en alemán. También limpia los caches en memoria de los módulos
      // tracker y quests para que el siguiente render no muestre datos obsoletos.
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(TRACKER_KEY);
      localStorage.removeItem(QUESTS_KEY);
      // Reset de los caches en memoria de los módulos tracker y quests
      try { if (typeof _trackerCache !== "undefined") _trackerCache = null; } catch (e) {}
      try { if (typeof _questsCache !== "undefined") _questsCache = null; } catch (e) {}
    } catch (e) { /* ignore */ }
  },
};

const detectPlatform = () => {
  if (typeof navigator === "undefined") return "other";
  const ua = navigator.userAgent || "";
  if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "ios";
  if (/Android/i.test(ua)) return "android";
  return "other";
};
